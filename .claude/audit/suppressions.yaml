# hq-core-staging — Path-based suppressions for hq-audit-bot
#
# Each entry suppresses findings whose file path matches `path` (gitignore
# glob semantics) AND meets one of:
#   - the scanner is in `scanners`, OR
#   - the rule_id is in `rules`, OR
#   - neither field is specified (path-only — suppresses ALL findings on
#     matching files).
#
# Suppressions are evaluated AFTER scanning, so the bot logs each dropped
# finding for the run summary but never includes them in the PR comment.
#
# Not needed here: IETF-reserved placeholder values. The org PII policy
# (hq-pr-review-settings defaults/policies/pii.md) excludes example.com/.net/
# .org and the .test/.example/.invalid/.localhost TLDs, loopback and TEST-NET
# IPs, and 555-01XX numbers before they become findings. Throwaway git
# identities on those domains no longer need a per-file entry.

- path: "audit-fixtures/**"
  reason: "Test fixtures for hq-audit-bot itself. Patterns here are deliberately constructed to exercise scanners; all values are fake (RFC-5733 phone, Visa test card, all-zero SSN, etc)."

- path: "core/policies/**"
  scanners: [pii, denylist]
  reason: "Core HQ policy definitions for the public scaffold; policy markdown may quote example regexes or denylist-shaped strings as documentation, not violations."

- path: "companies/_template/**"
  scanners: [pii, denylist, slugs]
  reason: "Starter scaffold for new HQ companies. Placeholder names (Acme, Voyage, etc.) are scaffolding examples, not real org references."

- path: "companies/_setup-examples/**"
  scanners: [pii, denylist, slugs]
  reason: "Onboarding example companies. Same rationale as _template."

- path: "**/*.snapshot.json"
  scanners: [pii]
  reason: "Vitest/Jest snapshot files; not human-authored content. Re-running tests regenerates them."

- path: "core/scripts/tests/qmd-handoff-reindex.test.sh"
  scanners: [pii]
  reason: "Throwaway qmd reindex fixtures only: disposable git-config identity uses an RFC 2606 reserved example.com address (documentation-only, no real mailbox); DEAD_PID sentinels are synthetic process IDs for stale-lock reclaim cases (not phone numbers or personal data)."

- path: "core/scripts/tests/normalize-eol-lf.test.sh"
  scanners: [pii]
  reason: "Disposable git-config identity in throwaway test fixture; uses example.com (RFC 2606 reserved), not a real mailbox."

- path: "core/scripts/__tests__/work-mesh.test.mjs"
  scanners: [pii]
  reason: "Work Mesh unit-test fixtures use loopback IPs, an RFC 2606 .test address, UUID-shaped IDs, and integer boundary values; none are real personal data."

- path: "core/scripts/tests/agent-runtime-skill-metadata.test.sh"
  rules: [pii/email]
  reason: "Metadata validator tests assert a pinned js-yaml package version; the npm specifier resembles an email address but is not PII."

- path: "core/scripts/tests/fixtures/hook-process-budgets/d3c1726c831181f43cf90731b916db4d36b5172b/.claude/hooks/block-unsafe-package-install.sh"
  rules: [pii/email]
  reason: "Byte-identical historical hook fixture contains scoped npm package version literals misclassified as email; source bytes and hashes are verified against the baseline commit."

- path: "core/scripts/tests/ontology-audience-grant.test.sh"
  rules: [pii/email]
  reason: "Stubbed hq members output uses made-up one-letter fixture addresses and generated example.test addresses; none belong to a real person."

- path: "core/scripts/tests/resolve-company.test.sh"
  rules: [pii/phone]
  reason: "The 10-digit literal on the drain-timing assertion is one second expressed in nanoseconds, not a phone number."
