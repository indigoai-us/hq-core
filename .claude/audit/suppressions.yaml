# hq-core-staging — Path-based suppressions for hq-audit-bot
#
# Each entry suppresses findings whose file path matches `path` (gitignore
# glob semantics) AND meets one of:
#   - the scanner is in `scanners`, OR
#   - the rule_id is in `rules`, OR
#   - neither field is specified (path-only — suppresses ALL findings on
#     matching files).
#
# Suppressions are evaluated AFTER scanning, so the bot logs each dropped
# finding for the run summary but never includes them in the PR comment.

- path: "audit-fixtures/**"
  reason: "Test fixtures for hq-audit-bot itself. Patterns here are deliberately constructed to exercise scanners; all values are fake (RFC-5733 phone, Visa test card, all-zero SSN, etc)."

- path: "core/policies/**"
  scanners: [pii, denylist]
  reason: "Core HQ policy definitions for the public scaffold; policy markdown may quote example regexes or denylist-shaped strings as documentation, not violations."

- path: "companies/_template/**"
  scanners: [pii, denylist, slugs]
  reason: "Starter scaffold for new HQ companies. Placeholder names (Acme, Voyage, etc.) are scaffolding examples, not real org references."

- path: "companies/_setup-examples/**"
  scanners: [pii, denylist, slugs]
  reason: "Onboarding example companies. Same rationale as _template."

- path: "**/*.snapshot.json"
  scanners: [pii]
  reason: "Vitest/Jest snapshot files; not human-authored content. Re-running tests regenerates them."

- path: "core/scripts/tests/hook-path-resolution.test.sh"
  scanners: [pii]
  reason: "Disposable git-config identity in throwaway test fixtures uses an RFC 2606 reserved .test address (example.test — never resolvable in DNS, no real mailbox); placeholder, not PII."

- path: "core/scripts/tests/handoff-finalize-large-changeset.test.sh"
  scanners: [pii]
  reason: "Disposable git-config identity in throwaway test fixtures uses an RFC 2606 reserved .invalid address (example.invalid — never resolvable in DNS, no real mailbox); placeholder, not PII."

- path: "core/scripts/tests/qmd-handoff-reindex.test.sh"
  scanners: [pii]
  reason: "Throwaway qmd reindex fixtures only: disposable git-config identity uses an RFC 2606 reserved example.com address (documentation-only, no real mailbox); DEAD_PID sentinels are synthetic process IDs for stale-lock reclaim cases (not phone numbers or personal data)."

- path: "core/scripts/__tests__/work-mesh.test.mjs"
  scanners: [pii]
  reason: "Work Mesh unit-test fixtures use loopback IPs, an RFC 2606 .test address, UUID-shaped IDs, and integer boundary values; none are real personal data."

- path: "core/scripts/tests/agent-runtime-skill-metadata.test.sh"
  rules: [pii/email]
  reason: "Metadata validator tests assert a pinned js-yaml package version; the npm specifier resembles an email address but is not PII."

- path: "test/__tests__/stories/US-011.test.mjs"
  scanners: [pii]
  reason: "Work Mesh acceptance tests bind an ephemeral in-process server to the IPv4 loopback address; the address is infrastructure test data, not PII."

- path: "core/scripts/tests/hq-delegate-bundle.test.sh"
  rules: [pii/email]
  reason: "Delegation bundle test fixtures use RFC 2606 reserved .test domain addresses (owner@acme.test, alice@acme.test) and git SSH remote URLs (git@github.test:...); none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-grant.test.sh"
  rules: [pii/email]
  reason: "Delegation grant test fixtures use RFC 2606 reserved .test domain addresses; none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-repo.test.sh"
  rules: [pii/email]
  reason: "Delegation repo test fixtures use RFC 2606 reserved .test domain addresses and git SSH remote URLs; none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-resolve.test.sh"
  rules: [pii/email]
  reason: "Delegation resolve test fixtures use RFC 2606 reserved .test domain addresses; none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-secrets.test.sh"
  rules: [pii/email]
  reason: "Delegation secrets test fixtures use RFC 2606 reserved .test domain addresses; none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-send.test.sh"
  rules: [pii/email]
  reason: "Delegation send test fixtures use RFC 2606 reserved .test domain addresses (owner@acme.test, alice@acme.test) and git SSH remote URLs (git@github.test:...); none are real email addresses or PII."

- path: "core/scripts/tests/hq-delegate-transfer.test.sh"
  rules: [pii/email]
  reason: "Delegation transfer test fixtures use RFC 2606 reserved .test domain addresses; none are real email addresses or PII."

- path: "core/knowledge/public/hq-core/delegation-bundle-spec.md"
  rules: [pii/email]
  reason: "Documentation spec file; the pii/email match is a git SSH remote URL (git@github.com:org/repo.git) inside a JSON code block illustrating the manifest schema, not a real email address."
