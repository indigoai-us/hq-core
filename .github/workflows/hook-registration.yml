name: Hook registration
on:
  # Only PRs that touch hook registration, the adapters or these tests.
  # pr-checks.yml also runs the engine and exec-form tests; this workflow adds
  # the full Linux, macOS and Windows matrix for all three.
  # On staging, PRs run the Linux leg only. Hosted macOS and Windows have no
  # PR leg there; a maintainer runs the full matrix by hand (workflow_dispatch).
  # A PR that needs macOS or Windows coverage runs the three tests locally or
  # asks Corey's conductor for a dispatch. Outside staging the matrix is
  # unchanged.
  workflow_dispatch:
  # Nightly on staging: the Codex adapter timeout-fit test waits out real
  # Codex hook timeouts, so it runs here and never on pull requests.
  schedule:
    - cron: '41 6 * * *'
  pull_request:
    paths:
      - '.claude/settings.json'
      - '.claude/hooks/**'
      - '.codex/hooks/**'
      - '.codex/config.toml'
      - '.grok/hooks/**'
      - 'core/scripts/restore-hook-settings.sh'
      - 'core/scripts/remove-stray-gate-hooks.sh'
      - 'core/scripts/check-hq-hooks.sh'
      - 'core/scripts/hook-lib.sh'
      - 'core/scripts/lib/hook-adapter-core.sh'
      - 'core/scripts/tests/restore-hook-settings.test.sh'
      - 'core/scripts/tests/restore-hook-engine.test.sh'
      - 'core/scripts/tests/hook-adapter-exec-form.test.sh'
      - 'core/scripts/tests/hook-adapter-jq-crlf.test.sh'
      - 'core/scripts/tests/codex-adapter-native-steps-aside.test.sh'
      - 'core/scripts/tests/codex-adapter-native-timeout-fit.test.sh'
      - '.github/workflows/hook-registration.yml'
permissions:
  contents: read
# A newer push to the same PR supersedes the in-flight matrix.
# Outside staging the group is per run, which leaves hq-core unchanged.
concurrency:
  group: ${{ github.repository == 'indigoai-us/hq-core-staging' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

jobs:
  restore:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'ci-hosted-runners'))) && vars.HQ_AWS_RUNNERS != 'off' && matrix.os == 'ubuntu-latest' && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-latest"') || matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.repository == 'indigoai-us/hq-core-staging' && github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # On windows-latest the engine test also compares the --hq-root token for
      # native, mixed, lower-case drive and upper-case spellings of a root with
      # a space against hq-cli's own launcherRoot(realpath) spelling.
      - name: Restore and rollback in temporary homes
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export USERPROFILE="$HOME"
          bash core/scripts/tests/restore-hook-settings.test.sh
          bash core/scripts/tests/restore-hook-engine.test.sh
          bash core/scripts/tests/hook-adapter-exec-form.test.sh
          bash core/scripts/tests/hook-adapter-jq-crlf.test.sh
          bash core/scripts/tests/codex-adapter-native-steps-aside.test.sh

  # Real elapsed time against each Codex hook timeout (about a minute), so it
  # is nightly on staging or dispatched by hand, never on a pull request. It
  # runs on the self-hosted Linux ARM pool, like pr-checks; the hosted label is
  # only the fallback when that pool is switched off. Linux only: the adapter never stands
  # aside on Windows. Pull requests check the wait caps from the adapter's
  # trace in codex-adapter-native-steps-aside.test.sh.
  codex-timeout-fit:
    if: ${{ (github.event_name == 'schedule' && github.repository == 'indigoai-us/hq-core-staging') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'ci-hosted-runners'))) && vars.HQ_AWS_RUNNERS != 'off' && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Codex adapter answers inside every Codex hook timeout
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          bash core/scripts/tests/codex-adapter-native-timeout-fit.test.sh

  hook-timeout-real-time:
    if: ${{ (github.event_name == 'schedule' && github.repository == 'indigoai-us/hq-core-staging') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'ci-hosted-runners'))) && vars.HQ_AWS_RUNNERS != 'off' && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Perl timeout fallback bounds the hook's whole process group
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          bash core/scripts/tests/master-hook-perl-timeout-process-group.test.sh
      - name: A cut child timeout reports its exit code and measured elapsed time
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          bash core/scripts/tests/hook-timeout-sentry-child-timeout.test.sh
      - name: Golden dispatcher contract, real-time cases (sequential and parallel)
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          bash core/scripts/tests/hook-contract/run-contract.sh --engine 'bash .claude/hooks/master-hook.sh' --suite real-time
          HQ_HOOK_PARALLEL=1 bash core/scripts/tests/hook-contract/run-contract.sh --engine 'bash .claude/hooks/master-hook.sh' --suite real-time
