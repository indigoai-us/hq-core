name: Recheck hq-core release gate

# A bounded first wait can expire while external PR checks are still running.
# Revisit the standing promotion PR every 15 minutes until it is held, merged,
# or its checks are ready. This workflow only reads/merges hq-core's standing
# PR; it never updates its source branch.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-core-release-gate-recheck
  cancel-in-progress: false

jobs:
  recheck:
    if: github.repository == 'indigoai-us/hq-core-staging'
    name: Recheck hq-core release gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_REPO: indigoai-us/hq-core
      HQ_AUDIT_BOT_APP_ID: ${{ secrets.HQ_AUDIT_BOT_APP_ID }}
      HQ_AUDIT_BOT_PRIVATE_KEY: ${{ secrets.HQ_AUDIT_BOT_PRIVATE_KEY }}
    steps:
      - name: Fail fast if App credentials missing
        if: env.HQ_AUDIT_BOT_APP_ID == '' || env.HQ_AUDIT_BOT_PRIVATE_KEY == ''
        run: |
          echo "::error::HQ_AUDIT_BOT_APP_ID or HQ_AUDIT_BOT_PRIVATE_KEY not set on this repo."
          exit 1
      - uses: actions/checkout@v4
      - name: Mint installation token for hq-core
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.HQ_AUDIT_BOT_APP_ID }}
          private-key: ${{ env.HQ_AUDIT_BOT_PRIVATE_KEY }}
          owner: indigoai-us
          repositories: hq-core
      - name: Recheck standing auto-promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$TARGET_REPO" --head promote/auto-main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open hq-core promote/auto-main PR to recheck."
            exit 0
          fi
          PR_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json headRefOid --jq '.headRefOid')"
          bash core/scripts/release-pr-check-gate.sh "$TARGET_REPO" "$PR_NUMBER" "$PR_HEAD_SHA" 600 30
