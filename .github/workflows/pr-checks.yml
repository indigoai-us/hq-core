  hooks-no-python:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # HQ's runtime hook layer must not depend on python3 (Windows machines
    # often have none — or the Store alias stub that resolves on PATH but
    # cannot run). Tripwire (no python3 invocations in runtime hooks/scripts),
    # hook-lib engine parity (jq vs node), and broken-python3 runtime proof
    # for policy injection + the frontmatter validator.
    name: hooks-no-python
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate the pinned hq CLI for forwarded helpers
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          command -v hq
          hq core --help
          HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
      - name: Hooks run python-free (tripwire + parity + broken-stub runtime)
        run: bash core/scripts/tests/hooks-no-python.test.sh
      - name: Policy recipe and knowledge-pulse scope contracts
        run: bash core/scripts/tests/us091-policy-and-skill-contract.test.sh
      - name: US-146 knowledge-pulse policy schema contract
        run: bash core/scripts/tests/knowledge-pulse-policy-schema.test.sh
      - name: Stray matcher-less hook-gate registrations are removed (jq + node)
        run: bash core/scripts/tests/remove-stray-gate-hooks.test.sh

  policy-trigger-migration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Trigger-less soft/unset policies must not be promoted into the always-on
    # SessionStart baseline; hard fallback and normal reactive injection stay live.
    name: policy-trigger-migration
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate the pinned hq CLI for hook helpers
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          command -v hq
          hq core --help
          HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
      - name: 300-policy hook process budget and output equivalence
        env:
          # The baseline must exist in the repo running the check. Staging's
          # backmerge cead9f4f and hq-core's v15.0.172 commit 64179657 carry
          # byte-identical copies of the two files the test compares. Only
          # staging has cead9f4f; hq-core and its forks get the public commit.
          HQ_HOOK_PERF_BASE_SHA: ${{ github.repository == 'indigoai-us/hq-core-staging' && 'cead9f4fce5f762ee08d169d4d47e912c1ef0bee' || '641796571f18e870a2e4cdd24575fda6b93dc4c3' }}
        run: |
          timeout 30s git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$HQ_HOOK_PERF_BASE_SHA"
          timeout 240s bash core/scripts/tests/sessionstart-policy-latency-process-budget.test.sh
      - name: Enforcement-gated policy trigger backfill
        run: bash core/scripts/tests/migrate-policy-triggers.test.sh
      - name: Retired digest path has no frontmatter exemption
        run: bash core/scripts/tests/validate-policy-frontmatter.test.sh
      - name: Emit contract — tsv shape, scope precedence, enforcement-tiered depth
        run: bash .claude/hooks/tests/inject-policy-on-trigger-emit.test.sh
      - name: check-stale-model-pin hook regression test
        run: bash .claude/hooks/tests/check-stale-model-pin.test.sh
      - name: Case-insensitive policy trigger identifier matching
        run: bash core/scripts/tests/eval-trigger.test.sh
      - name: Policy trigger end-to-end corpus coverage
        run: bash core/scripts/tests/inject-policy-e2e.test.sh
      - name: Large policy trigger inputs stay out of argv
        run: bash core/scripts/tests/inject-policy-arg-size.test.sh
      - name: inject-policy-cache.test.sh
        run: bash core/scripts/tests/inject-policy-cache.test.sh
      - name: Contended policy ledger locks cannot stall SessionStart
        run: bash core/scripts/tests/inject-policy-ledger-lock-deadline.test.sh
      - name: derive-trigger-facts.test.sh
        run: bash core/scripts/tests/derive-trigger-facts.test.sh
      - name: Inject cadence (once vs always) + PreCompact ledger purge
        run: bash core/scripts/tests/inject-policy-always-inject.test.sh
      - name: Policy scan forks no helper process per policy file
        run: bash core/scripts/tests/inject-policy-no-per-file-fork.test.sh
      - name: Matched hard policy bodies are parsed in one batch
        run: bash core/scripts/tests/inject-policy-batched-bodies.test.sh
      - name: Policy trigger linter streams ARG_MAX-scale corpora
        run: bash core/scripts/tests/lint-policy-triggers.test.sh
      - name: Narrowed git and gh policy triggers still cover every mutation
        run: bash core/scripts/tests/git-policy-trigger-coverage.test.sh

  hook-helper-forwarders:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hook-helper-forwarders
    runs-on: ubuntu-24.04-arm
