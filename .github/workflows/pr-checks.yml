      - name: Hook trigger helpers run through generated forwarders
        run: bash .claude/hooks/tests/inject-policy-on-trigger-emit.test.sh

  personal-policy-overlay:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The personal→core policy mirror is retired: the trigger hook must read
    # personal/policies DIRECTLY (no core/policies symlink mirror), and the
    # drift detector must classify + prune only behavior-neutral orphan copies
    # while never touching a diverged twin or a core-only shipped policy.
    name: personal-policy-overlay
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate the pinned hq CLI for hook helpers
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          command -v hq
          hq core --help
          HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
      - name: personal/policies is read directly by the trigger hook (no mirror)
        run: bash core/scripts/tests/personal-policy-overlay.test.sh
      - name: stale core/policies mirror detector classifies + prunes safely
        run: bash core/scripts/tests/detect-stale-core-policy-mirror.test.sh

  stale-review-base:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # An HQ root that is a git repo with a remote attached drifts thousands of
    # autosave commits ahead of its remote-tracking ref (HQ is never pushed).
    # A review tool that auto-selects a base picks that ref and builds a
    # whole-tree diff from it — the 2026-07-28 Codex desktop git-worker SIGTRAP.
    # The detector must flag those refs and repair them WITHOUT touching local
    # branches, the configured remote, or any repos/ clone.
    name: stale-review-base
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: stale review-base detector reports + repairs safely
        run: bash core/scripts/tests/detect-stale-review-base.test.sh
      - name: session-start hook auto-repairs installs and spares clones
        run: bash core/scripts/tests/repair-stale-review-base-hook.test.sh

  prefer-native-capabilities:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # hq-prefer-native-capabilities must inject at session start (always-on
