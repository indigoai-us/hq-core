      - name: Handoff auto-files hq-core deficiencies once per handoff
        run: bash core/scripts/tests/handoff-autofile.test.sh
      - name: Handoff builder route decides builder vs public from the staging repo
        run: bash core/scripts/tests/handoff-builder-route.test.sh
      - name: Handoff decides whether to archive its own desktop session
        run: bash core/scripts/tests/handoff-archive-decision.test.sh
      - name: Retro merges thread deficiencies with its own lever findings
