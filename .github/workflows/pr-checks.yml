name: pr-checks

# Ports the /promote-hq-core local rule set to PR-time CI. Each job maps to
# a named HQ policy — failure annotations include the policy slug so the
# contributor can find the rule. See:
#   core/policies/hq-cmd-promote-hq-core-*.md (in HQ)

# When each job runs (kept small to hold Actions cost down):
#   - Ready (non-draft) pull requests and manual workflow_dispatch: every
#     Linux job. The macOS and Windows smoke jobs also run on dispatch.
#   - Nightly schedule: the required Linux checks (the jobs main_protect
#     requires) and the GitHub-hosted macOS and Windows smoke jobs
#     (shell-smoke-macos, shell-smoke-windows, codex-windows-hook-launcher).
#     The smoke path gates fail open on the schedule, so they always run.
#     The grouped linux-checks-N jobs never run on the schedule.
#   - Stable release tags (v*, not v*-*) pushed on hq-core-staging: the macOS and Windows smoke
#     jobs, plus denylist-scan, which computes their path gates. A new tag has
#     no before SHA, so the gates fail open. On hq-core a tag runs nothing.
#   - Nothing runs on a branch push, including main.
#   - Draft pull requests run nothing.
# On staging, macOS has no pull_request leg at all. It runs on the nightly
# schedule, release tags and workflow_dispatch only. A PR that needs macOS
# coverage asks Corey's conductor for a run, or uses the local-run path once
# LOCAL-MAC-1 lands.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    # Stable release tags only (owner decision): v* runs, and any pre-release
    # tag with a hyphen, such as v1.2.3-beta.1, is skipped. This line alone
    # sets the scope; the job conditions accept any refs/tags/v ref.
    tags: ['v*', '!v*-*']
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Mechanical checks (no LLM) ─────────────────────────────────────

  denylist-scan:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'indigoai-us/hq-core-staging') }}
    name: denylist-scan
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    outputs:
      macos_shell_smoke: ${{ steps.shell_smoke_macos_paths.outputs.run }}
      windows_shell_smoke: ${{ steps.shell_smoke_windows_paths.outputs.run }}
      resumework_timing: ${{ steps.resumework_timing_paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert cost-efficient Linux runner labels
        run: bash core/scripts/tests/runner-cost-arm-labels.test.sh
      - name: Detect changes covered by the macOS shell smoke job
        id: shell_smoke_macos_paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GATE_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'forced' || github.event_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$GITHUB_REF" == refs/tags/* ]]; then
            # Nightly and release-tag runs have no meaningful base: an empty
            # base makes the detector fail open (run=true).
            base_sha=''
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash core/scripts/ci/should-run-macos-shell-smoke.sh \
            "$base_sha" "$GITHUB_SHA" "$GITHUB_WORKSPACE" "$GATE_MODE" >> "$GITHUB_OUTPUT"
      - name: Detect Windows shell smoke and skill-runtime inputs
        id: shell_smoke_windows_paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GATE_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'forced' || github.event_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$GITHUB_REF" == refs/tags/* ]]; then
            # Nightly and release-tag runs have no meaningful base: an empty
            # base makes the detector fail open (run=true).
            base_sha=''
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash core/scripts/ci/should-run-windows-shell-smoke.sh \
            "$base_sha" "$GITHUB_SHA" "$GITHUB_WORKSPACE" "$GATE_MODE" >> "$GITHUB_OUTPUT"
      - name: Detect changes covered by the resumework timing job
        id: resumework_timing_paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GATE_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'forced' || github.event_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$GITHUB_REF" == refs/tags/* ]]; then
            # Nightly and release-tag runs have no meaningful base: an empty
            # base makes the detector fail open (run=true).
            base_sha=''
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash core/scripts/ci/should-run-resumework-timing.sh \
            "$base_sha" "$GITHUB_SHA" "$GITHUB_WORKSPACE" "$GATE_MODE" >> "$GITHUB_OUTPUT"
      - name: Shell smoke platform path filter regression test
        run: bash core/scripts/tests/shell-smoke-macos-paths.test.sh
      - name: Shell smoke timeout runner overlap and failure regression test
        run: bash core/scripts/tests/shell-smoke-timeout-runner.test.sh
      - name: No tracked references to deleted script paths
        run: bash core/scripts/check-deleted-script-refs.sh
      - name: Deleted script reference guard regression test
        run: bash core/scripts/tests/check-deleted-script-refs.test.sh
      - name: Codex policy rubric batching workflow contract
        run: bash core/scripts/tests/cost-workflow-pr-checks.test.sh
      - name: Workflow global npm installs pin exact versions
        run: bash core/scripts/tests/workflow-global-install-pins.test.sh
      - name: Minimal GitHub Actions contract (tag-only push, no macOS/Windows on PRs)
        run: bash core/scripts/tests/pr-checks-minimal-actions.test.sh
      - name: Grouped check per-job summary regression test
        run: bash core/scripts/tests/grouped-check-summary.test.sh
      - name: ShellCheck installer never apt-installs on self-hosted runners
        run: bash core/scripts/tests/install-shellcheck.test.sh
      - name: Release promotion checks gate regression test
        run: bash core/scripts/tests/release-pr-check-gate.test.sh
      - name: US-016 Tart VM harness stub regression test
        run: bash core/scripts/tests/anywhere-vm-test.test.sh
      - name: MSYS2 environment guards match UCRT64 and CLANG64
        run: bash core/scripts/tests/msys2-environment-guards.test.sh
      - name: PR review checkout stays cached, scoped and cleaned up
        run: bash core/scripts/tests/review-checkout.test.sh
      - name: Run denylist scan
        run: bash .leak-scan/scan.sh denylist --warn

  policy-rationale-scan:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: policy-rationale-scan
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run policy-rationale scan
        run: bash .leak-scan/scan.sh policy-rationale --warn

  # Stub: slug-scan is a required check in rulesets 17280851 (hq-core-staging) and
  # 15744312 (hq-core). Keep the job name until both rulesets drop it.
  slug-scan:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: slug-scan
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - name: Retired check (no-op)
        run: echo "retired by owner direction 2026-10-21; remove from ruleset then delete this job"

  users-path-tripwire:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: users-path-tripwire
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: /Users/ absolute-path tripwire
        run: bash .leak-scan/scan.sh users-path --warn

  provenance-stripped:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: provenance-stripped
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ## Provenance section must not be present
        run: bash .leak-scan/scan.sh provenance --warn

  vendor-public-ok:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: vendor-public-ok
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor-scoped policies need vendor_public_ok
        run: bash .leak-scan/scan.sh vendor-public-ok --warn

  public-frontmatter-revalidate:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: public-frontmatter-revalidate
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-validate public:true frontmatter
        run: bash .leak-scan/scan.sh public-frontmatter --warn

  # Stub: denylist-drift is a required check in rulesets 17280851 (hq-core-staging) and
  # 15744312 (hq-core). Keep the job name until both rulesets drop it.
  denylist-drift:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: denylist-drift
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - name: Retired check (no-op)
        run: echo "retired by owner direction 2026-10-21; remove from ruleset then delete this job"

  settings-local-not-ignored:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    name: settings-local-not-ignored
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .claude/settings.local.json must not be gitignored
        run: bash .leak-scan/scan.sh settings-local-not-ignored
      - name: .gitignore covers tokens/ and credential-shaped core/settings files
        run: bash core/scripts/tests/gitignore-secret-paths.test.sh

  skill-command-refs:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    # DEV-1716: a core skill must not instruct a slash-command that isn't
    # resolvable on the install it is shown to. Engineering commands
    # (/run-project, /execute-task, ...) live in the separately-installed
    # hq-pack-engineering and must be allowlisted (+ referenced with their
    # install line), never presented as always-available. Catches FUTURE
    # dangling references, not just the originally-reported skills.
    name: skill-command-refs
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core skills only instruct resolvable commands
        run: bash core/scripts/lint-skill-command-refs.sh

  install-deps:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    # DEV-1727: HQ's install/setup surface must not install or dependency-check
    # a third-party CLI that HQ itself never calls. The /setup wizard used to
    # `which vercel` + offer `npm install -g vercel`, gating setup on a tool
    # /deploy never uses (it targets hq-deploy). Denylist: core/scripts/
    # install-deps.deny. Catches FUTURE re-introductions, not just vercel.
    name: install-deps
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install surface installs no user-provided deploy CLI
        run: bash core/scripts/lint-install-deps.sh
      - name: Regression test (fixture + live tree + fix present)
        run: bash core/scripts/tests/install-deps.test.sh

  hq-cowork-mcp-secret-guard:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: hq-cowork-mcp-secret-guard
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run cowork plugin build prerequisite test
        run: bash core/packages/hq-pack-cowork/scripts/tests/build-plugin-prerequisites.test.sh
      - name: Run cowork plugin build frozen install test
        run: bash core/packages/hq-pack-cowork/scripts/tests/build-plugin-frozen-install.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Install pinned MCP server dependencies
        run: pnpm --dir core/packages/hq-pack-cowork/mcp-server install --frozen-lockfile --ignore-workspace
      - name: Run hq-pack-cowork MCP server tests
        run: pnpm --dir core/packages/hq-pack-cowork/mcp-server test

  # Installer→Claude PATH gap: the template must not hardcode env.PATH, and
  # the setup.sh snapshot must include the native installer's managed
  # toolchain dirs even when the session PATH is missing them (GUI-launched
  # Claude never sources the shell-profile block that wires them in).
  # US-001: canonical YAML-backed validation for shipped skill metadata and
  # generated agents/openai.yaml contracts.
  agent-runtime-skill-metadata:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: agent-runtime-skill-metadata
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned YAML parser for skill metadata contracts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/agent-runtime-parser"
          node core/scripts/validate-agent-runtime-contracts.mjs install-parser --install-dir "$install_dir"
          echo "HQ_AGENT_RUNTIME_PARSER_ROOT=$install_dir" >> "$GITHUB_ENV"
      - name: Validate shipped skill metadata + openai.yaml
        run: node core/scripts/validate-agent-runtime-contracts.mjs
      - name: Skill metadata regression test
        run: bash core/scripts/tests/agent-runtime-skill-metadata.test.sh
      - name: check-skill-edit local pre-push wrapper contract
        run: bash core/scripts/tests/check-skill-edit.test.sh
      - name: Codex pack build regression test
        run: bash core/scripts/tests/build-codex-pack.test.sh
      - name: HQ Anywhere package contract regression test
        run: bash core/scripts/tests/hq-anywhere-package-contract.test.sh
      - name: Outpost host app regression test
        run: bash core/scripts/tests/outpost-host-app.test.sh
      - name: HQ Anywhere hook flag cache regression test
        run: bash core/scripts/tests/hqd-hook-flag-cache.test.sh
      - name: master-hook bounds the hq-anywhere flag read and keeps flag-off live
        run: bash core/scripts/tests/master-hook-flag-reader-bounded.test.sh
      - name: Claude Code plugin build regression test
        run: bash core/scripts/tests/build-claude-plugin.test.sh
      - name: Agent bootstrap cloud sync guidance regression test
        run: bash core/scripts/tests/agent-bootstrap-cloud-sync.test.sh
      - name: hq-heal sync classifier regression test
        run: bash core/scripts/tests/hq-heal-sync-classifier.test.sh
      - name: hq-heal sandbox-network classifier regression test
        run: bash core/scripts/tests/hq-heal-sandbox-network-classifier.test.sh
      - name: hq-heal work-registry classifier regression test
        run: bash core/scripts/tests/hq-heal-work-registry-classifier.test.sh
      - name: Discover shallow clone fetch refspec regression test
        run: bash core/scripts/tests/discover-shallow-clone-fetch-all.test.sh
      - name: Execute-task Codex model source regression test
        run: bash core/scripts/tests/execute-task-codex-model-source.test.sh
      - name: Worker Codex model company/personal override regression test
        run: bash core/scripts/tests/worker-codex-model.test.sh
      - name: run-project host-native path state.json progress regression test
        run: bash core/scripts/tests/run-project-agent-path-state.test.sh
      - name: OpenAI YAML generator root regression test
        run: bash core/scripts/tests/generate-openai-yaml-root.test.sh
      - name: Codex skill metadata coverage regression test
        run: bash core/scripts/tests/codex-skill-metadata-coverage.test.sh
      - name: export-skill-catalog wrapper regression test
        run: bash core/scripts/tests/export-skill-catalog.test.sh
      - name: Validate concrete shipped skill command permissions
        run: node core/scripts/validate-agent-runtime-contracts.mjs validate-permissions
      - name: Skill command permission regression test
        run: bash core/scripts/tests/agent-runtime-permissions.test.sh
      - name: Install ShellCheck for cross-runtime shell contracts
        # Self-hosted runners have no sudo; this falls back to a pinned,
        # checksum-verified upstream binary.
        run: bash core/scripts/ci/install-shellcheck.sh
      - name: ShellCheck cross-runtime adapters and fixtures
        run: |
          shellcheck -S warning \
            core/scripts/hook-lib.sh \
            core/scripts/tests/hook-detach-msys-console.test.sh \
            .claude/skills/deploy/scripts/tests/deploy-api-request-msys-upload-path.test.sh \
            core/scripts/lint-shell-portability.sh \
            core/scripts/hq-job-run.sh \
            core/scripts/hq-job-notify.sh \
            core/scripts/outpost-jobs-reconcile.sh \
            core/scripts/handoff-finalize.sh \
            core/scripts/hq-job-probe.sh \
            core/scripts/tests/hq-job-run.test.sh \
            core/scripts/tests/hq-job-run-approval-mode.test.sh \
            core/scripts/tests/hq-job-probe.test.sh \
            core/scripts/tests/outpost-jobs-reconcile.test.sh \
            core/scripts/tests/personal-job-oncalendar.test.sh \
            core/scripts/tests/outpost-cron-oncalendar.test.sh \
            core/scripts/company-jobs-install.sh \
            core/scripts/tests/fixtures/company-jobs-install.sh \
            core/scripts/tests/company-jobs-account.test.sh \
            core/scripts/tests/outpost-job-failure-alerts.test.sh \
            core/scripts/tests/handoff-finalize-pointer.test.sh \
            core/scripts/tests/handoff-finalize-deficiencies.test.sh \
            core/scripts/tests/handoff-finalize-no-jq.test.sh \
            core/scripts/tests/handoff-finalize-media-filter.test.sh \
            core/scripts/tests/handoff-finalize-index-lock-retry.test.sh \
            core/scripts/tests/handoff-finalize-logical-root.test.sh \
            core/scripts/tests/handoff-finalize-json-args.test.sh \
            core/scripts/tests/handoff-company-digit-slug.test.sh \
            core/scripts/handoff-autofile.sh \
            core/scripts/tests/handoff-autofile.test.sh \
            core/scripts/handoff-builder-route.sh \
            core/scripts/tests/handoff-builder-route.test.sh \
            core/scripts/handoff-archive-decision.sh \
            core/scripts/tests/handoff-archive-decision.test.sh \
            core/scripts/retro-merge-deficiencies.sh \
            core/scripts/tests/retro-merge-deficiencies.test.sh \
            core/scripts/tests/agent-runtime-skill-metadata.test.sh \
            core/scripts/check-skill-edit.sh \
            core/scripts/tests/check-skill-edit.test.sh \
            core/scripts/skills-listing-budget.sh \
            core/scripts/tests/skills-listing-budget.test.sh \
            core/scripts/skill-inventory.sh \
            core/scripts/tests/skill-inventory.test.sh \
            core/scripts/generate-openai-yaml.sh \
            core/scripts/tests/discover-shallow-clone-fetch-all.test.sh \
            core/scripts/tests/execute-task-codex-model-source.test.sh \
            core/scripts/worker-codex-model.sh \
            core/scripts/tests/worker-codex-model.test.sh \
