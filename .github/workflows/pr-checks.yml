  core-yaml-version-monotonic:
    # hq-core ONLY. Promote PRs (the only kind hq-core sees) always bump
    # core/core.yaml hqVersion via promote-to-hq-core.yml; this check enforces
    # that the bump is strictly greater than origin/main. Staging is exempt —
    # staging churns intra-version without bumping hqVersion.
    name: core-yaml-version-monotonic
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'indigoai-us/hq-core') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: core/core.yaml hqVersion must strictly increase
        run: bash .leak-scan/scan.sh core-yaml-version-monotonic

  pr-author-hq-audit-bot:
    # hq-core ONLY. The only PRs hq-core ever receives are the promote/backmerge
    # PRs opened by the hq-audit-bot App (see promote-to-hq-core.yml). Any PR
    # authored by a human — or any other bot — is illegitimate on hq-core and
    # must be blocked from merging: real work lands on hq-core-staging and is
    # promoted here by the bot. Staging is exempt (the job is skipped there),
    # so human contributors are never blocked on staging.
    #
    # This file is promoted into hq-core verbatim; the repository guard keeps
    # the job inert on staging. To actually block merges, this job's name
    # ("pr-author-hq-audit-bot") must be listed as a required status check in
    # hq-core's main_protect ruleset.
    name: pr-author-hq-audit-bot
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'indigoai-us/hq-core') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - name: PR author must be the hq-audit-bot App
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            hq-audit-bot|"hq-audit-bot[bot]")
              echo "PR author '$PR_AUTHOR' is the HQ audit bot — allowed."
              ;;
            *)
              echo "::error::PR author '${PR_AUTHOR}' is not the HQ audit bot. indigoai-us/hq-core only accepts PRs opened by hq-audit-bot (promoted from hq-core-staging). Open your change against hq-core-staging instead."
              exit 1
              ;;
          esac

  # ─── Codex-augmented semantic check ────────────────────────────────
  # Per-file PASS/EDIT/DROP rubric, mirroring /promote-hq-core Phase 3.
  # Dynamic matrix over changed policy files; capped at 10 in parallel
  # to match the local batching rule.

  collect-policy-changes:
    name: collect-policy-changes
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) || github.event_name == 'schedule' }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    outputs:
      files: ${{ steps.collect.outputs.files }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: collect
        name: List changed core/policies/*.md files
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base="${{ github.base_ref }}"
            git fetch origin "$base" --depth=1
            range="origin/$base...HEAD"
          else
            # Manual dispatch or the nightly schedule: compare with the
            # parent commit. codex-pii-rubric only consumes this on PRs.
            range="HEAD~1..HEAD"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$range" \
            | grep -E '^\core/policies/[^/]+\.md$' || true)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "files=[]" >> "$GITHUB_OUTPUT"
            echo "count=0"  >> "$GITHUB_OUTPUT"
          else
            json="$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)"
            echo "files=$json" >> "$GITHUB_OUTPUT"
            echo "count=${#changed[@]}" >> "$GITHUB_OUTPUT"
          fi

  codex-pii-rubric:
    name: codex-pii-rubric
    needs: collect-policy-changes
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          needs.collect-policy-changes.outputs.count != '0' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-codex-rubric') }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install codex CLI
        # Exact pin, the same version codex-windows-hooks.yml installs. Bump both together.
        env:
          CODEX_VERSION: 0.163.0
        run: npm i -g "@openai/codex@$CODEX_VERSION"
      - name: Run rubrics for changed policies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: gpt-5
          POLICY_FILES: ${{ needs.collect-policy-changes.outputs.files }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            status=0
            out="$(bash .leak-scan/codex-rubric.sh "$file")" || status=$?
            echo "$out"
            if [[ "$status" -ne 0 ]]; then
              echo "::error::Policy rubric failed for $file with status $status."
              failed=1
            fi
            # Keep each policy verdict distinct in the job summary.
            {
              echo "## Rubric: $file"
              echo '```json'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[]' <<< "$POLICY_FILES")
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

  # ─── Provider adapter contract (US-504) ─────────────────────────────
  #
  # One job covering the whole adapter surface: cross-provider parity, the
  # three per-adapter suites, and the capability-snapshot drift check.
  #
  # WHY THE SNAPSHOT CHECK IS HERE AND NOT OPTIONAL. capabilities.generated.json
  # is the only mechanism by which hq-pro control-plane TypeScript can read a
  # descriptor that otherwise exists solely as bash on an agent box. If it goes
  # stale, the control plane routes work using capabilities the fleet no longer
  # has -- e.g. sending a plan turn to a provider that has since declared
  # plan_mode=absent. The failure is silent in production and cheap to catch here.
  #
  # Toolchain is bash + jq only (both preinstalled on ubuntu-latest), per the
  # story's constraint -- no node, no package install, nothing to drift.
  provider-adapter-contract:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: provider-adapter-contract
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paths filter, implemented in bash rather than a marketplace action so
      # the job keeps its bash+jq-only guarantee and gains no new dependency.
      #
      # provider-adapter-version.sh is included beyond the story's literal path
      # list on purpose: a contract-version bump changes the snapshot's
      # contractVersion field without touching any adapter file, so filtering
      # on the adapters alone would let that specific drift through unnoticed.
      - name: Decide whether adapter contract files changed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            changed="$(git diff --name-only "$base"...HEAD || true)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          echo "$changed" | grep -qE '^core/scripts/lib/provider-adapter\.sh$|^core/scripts/lib/provider-adapters/|^core/scripts/lib/provider-adapter-version\.sh$|^core/scripts/generate-adapter-capabilities\.sh$|^core/scripts/tests/provider-adapter-|^core/scripts/tests/probes/|^core/scripts/codex-preflight\.sh$|^core/scripts/convert-codex\.sh$|^core/scripts/tests/codex-sandbox-danger-full-access\.test\.sh$|^core/workers/public/dev-team/|^\.claude/scripts/run-project\.sh$|^\.claude/skills/execute-task/SKILL\.md$|^\.codex/config\.toml$|^\.codex/hooks/hq-codex-hook|^core/scripts/tests/codex-windows-hook-launcher' \
            && echo "run=true" >> "$GITHUB_OUTPUT" \
            || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Cross-provider parity conformance
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-parity.test.sh

      - name: codex adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-codex.test.sh

      - name: codex sandbox danger-full-access (finding 2.3)
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/codex-sandbox-danger-full-access.test.sh

      - name: codex Windows hook launcher (feedback_d0c2f082)
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/codex-windows-hook-launcher.test.sh

      - name: grok adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-grok.test.sh

      - name: claude adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-claude.test.sh

      - name: Capability snapshot is not stale
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-capabilities-snapshot.test.sh

  # ─── Codex hooks on Windows (feedback_d0c2f082) ─────────────────────
  #
  # Runs every commandWindows string from .codex/config.toml through
  # `cmd.exe /C "<command>"`, the way Codex starts hooks on Windows, against a
  # fake HQ root with the real launcher and a stub adapter. Pins byte-identical
  # stdin, exit 2 with HQ_ROOT set and unset, fail-closed exits for a missing
  # bash or launcher, and folder names with ")" and a space.
  #
  # GitHub-hosted Windows runs only on manual workflow_dispatch and the
  # nightly schedule, never on pull requests, to keep Actions cost down. Both
  # events always run the runtime test; the path filter below applies to any
  # other event.
  codex-windows-hook-launcher:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'indigoai-us/hq-core-staging')) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: codex-windows-hook-launcher
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether codex Windows hook files changed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            changed="$(git diff --name-only "$base"...HEAD || true)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          echo "$changed" | grep -qE '^\.codex/config\.toml$|^\.codex/hooks/hq-codex-hook|^core/scripts/tests/codex-windows-hook-launcher' \
            && echo "run=true" >> "$GITHUB_OUTPUT" \
            || echo "run=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: codex Windows hook launcher runtime (cmd.exe /C)
        run: node core/scripts/tests/codex-windows-hook-launcher-runtime.test.mjs

  # Grouped Linux checks (13 former jobs, ~8.2 min).
  # Each step is prefixed with its former job name; a failure skips the
  # rest of that job's steps only, and the last step lists results per job.
