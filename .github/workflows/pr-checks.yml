        run: bash core/scripts/tests/master-hook-repogit-command-roundtrip.test.sh
      - name: Bash guards collapse jq.exe CRLF in the stdin fallback
        run: bash core/scripts/tests/hook-stdin-crlf-fallback.test.sh
      - name: Main's master hook no longer exports the 40 KB command
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          main_hook="$runner_temp/main-master-hook.sh"
          # git show writes the blob bytes. Do not checkout main's hook through
          # the worktree; core.autocrlf would rewrite it.
          git show FETCH_HEAD:.claude/hooks/master-hook.sh > "$main_hook"
          log="$runner_temp/roundtrip-main.log"
          set +e
          MASTER_HOOK_SOURCE_OVERRIDE="$main_hook" \
            bash core/scripts/tests/master-hook-repogit-command-roundtrip.test.sh >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          test "$rc" -eq 0
          grep -F 'PASS oversized command leaves HQ_HOOK_COMMAND unset' "$log"
          grep -F 'PASS multiline-clone denied' "$log"
          if grep -F 'oversized command exported' "$log"; then
            echo "main's master hook exports the 40 KB command again" >&2
            exit 1
          fi
          if grep -F 'Argument list too long' "$log"; then
            echo 'jq argv limit still hides the 40 KB case' >&2
            exit 1
          fi
