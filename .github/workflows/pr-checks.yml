name: pr-checks

# Ports the /promote-hq-core local rule set to PR-time CI. Each job maps to
# a named HQ policy — failure annotations include the policy slug so the
# contributor can find the rule. See:
#   core/policies/hq-cmd-promote-hq-core-*.md (in HQ)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Mechanical checks (no LLM) ─────────────────────────────────────

  denylist-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: denylist-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run denylist scan
        run: bash .leak-scan/scan.sh denylist

  policy-rationale-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: policy-rationale-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run policy-rationale scan
        run: bash .leak-scan/scan.sh policy-rationale

  slug-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: slug-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run private tenant slug scan
        run: bash .leak-scan/scan.sh slugs

  users-path-tripwire:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: users-path-tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: /Users/ absolute-path tripwire
        run: bash .leak-scan/scan.sh users-path

  provenance-stripped:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: provenance-stripped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ## Provenance section must not be present
        run: bash .leak-scan/scan.sh provenance

  vendor-public-ok:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: vendor-public-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor-scoped policies need vendor_public_ok
        run: bash .leak-scan/scan.sh vendor-public-ok

  public-frontmatter-revalidate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: public-frontmatter-revalidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-validate public:true frontmatter
        run: bash .leak-scan/scan.sh public-frontmatter

  denylist-drift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: denylist-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Denylist must mirror HQ manifest snapshot
        run: bash .leak-scan/scan.sh denylist-drift

  settings-local-not-ignored:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: settings-local-not-ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .claude/settings.local.json must not be gitignored
        run: bash .leak-scan/scan.sh settings-local-not-ignored

  repos-segment-not-ignored:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: repos-segment-not-ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: nested knowledge/repos/ must sync; only top-level repos/ excluded (DEV-1791)
        run: bash .leak-scan/scan.sh repos-segment-not-ignored

  instance-artifacts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: instance-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: workspace/ and personal/ ship only scaffold — no session/operator instance state
        run: bash .leak-scan/scan.sh instance-artifacts
      - name: Regression test (fixture clean/leak cases + live tree)
        run: bash core/scripts/tests/leak-scan-instance-artifacts.test.sh

  skill-command-refs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1716: a core skill must not instruct a slash-command that isn't
    # resolvable on the install it is shown to. Engineering commands
    # (/run-project, /execute-task, ...) live in the separately-installed
    # hq-pack-engineering and must be allowlisted (+ referenced with their
    # install line), never presented as always-available. Catches FUTURE
    # dangling references, not just the originally-reported skills.
    name: skill-command-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core skills only instruct resolvable commands
        run: bash core/scripts/lint-skill-command-refs.sh

  skill-script-refs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # WC-17: a skill must not retain a path to a shell script removed with a
    # retired workflow; commands and local script references are both released
    # guidance that must resolve on a fresh scaffold.
    name: skill-script-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core skills only reference shipped local shell scripts
        run: |
          bash core/scripts/lint-skill-script-refs.sh learn
          bash core/scripts/lint-skill-script-refs.sh resumework
          bash core/scripts/lint-skill-script-refs.sh startwork
      - name: Regression test (fixture + all skills + allowlist + WC-17 fix)
        run: bash core/scripts/tests/skill-script-refs.test.sh
      - name: Company resolver (session bind + whole-token prompt scan)
        run: bash core/scripts/tests/resolve-company.test.sh
      - name: /resumework requires explicit confirmation for locked threads
        run: bash core/scripts/tests/resume-thread-lock.test.sh

  setup-skill-direct-install:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # /setup must install missing CLI tools directly, never re-introduce the
    # install-all/some/none prompt that made onboarding pause mid-flow. Pins the
    # direct-install invariant plus the auth/bootstrap carve-outs the fix relies on.
    name: setup-skill-direct-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: /setup installs missing tools directly (no tool-choice prompt)
        run: bash core/scripts/tests/setup-skill-direct-install.test.sh
      - name: Setup completeness checklist and SessionStart nag
        run: bash core/scripts/tests/setup-completeness-nag.test.sh

  worktree-gc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Safe worktree garbage collector. The data-safety invariants (never remove
    # a dirty, unmerged/unpushed, too-recent, or in-use worktree; default
    # dry-run) are enforced by this offline fixture test, not reviewer vigilance.
    # Policy: core/policies/hq-worktree-retention.md
    name: worktree-gc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GC removes only provably-safe stale worktrees
        run: bash core/scripts/tests/worktree-gc.test.sh

  hq-delegate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # /delegate — one-command project handoff. Every helper ships with an
    # offline regression test (stubbed hq CLI / real git fixtures). The two
    # hard rules (no secret values, no share-session URLs in any delegation
    # artifact) are enforced by these tests, not reviewer vigilance. Policy:
    # core/policies/hq-delegate-never-inlines-secrets-or-share-urls.md
    name: hq-delegate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle builder (schema, prefix conventions, fail-closed secret scan)
        run: bash core/scripts/tests/hq-delegate-bundle.test.sh
      - name: Recipient resolution (person/agent, tenancy-safe)
        run: bash core/scripts/tests/hq-delegate-resolve.test.sh
      - name: Vault grants (direct-only, verified read-back)
        run: bash core/scripts/tests/hq-delegate-grant.test.sh
      - name: Repo/branch handover (anchored push, dirty work surfaced)
        run: bash core/scripts/tests/hq-delegate-repo.test.sh
      - name: Secrets by name only (sentinel no-value-leak)
        run: bash core/scripts/tests/hq-delegate-secrets.test.sh
      - name: Ownership transfer (board/PRD/mesh/journal, idempotent)
        run: bash core/scripts/tests/hq-delegate-transfer.test.sh
      - name: Pickup prompt + single-DM delivery (verify-gated)
        run: bash core/scripts/tests/hq-delegate-send.test.sh
      - name: Reachability probe + inert dry run
        run: bash core/scripts/tests/hq-delegate-verify.test.sh
      - name: /delegate skill structural contract
        run: bash core/scripts/tests/hq-delegate-skill.test.sh
      - name: /delegate script references resolve
        run: bash core/scripts/lint-skill-script-refs.sh delegate

  install-deps:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1727: HQ's install/setup surface must not install or dependency-check
    # a third-party CLI that HQ itself never calls. The /setup wizard used to
    # `which vercel` + offer `npm install -g vercel`, gating setup on a tool
    # /deploy never uses (it targets hq-deploy). Denylist: core/scripts/
    # install-deps.deny. Catches FUTURE re-introductions, not just vercel.
    name: install-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install surface installs no user-provided deploy CLI
        run: bash core/scripts/lint-install-deps.sh
      - name: Regression test (fixture + live tree + fix present)
        run: bash core/scripts/tests/install-deps.test.sh

  # Installer→Claude PATH gap: the template must not hardcode env.PATH, and
  # the setup.sh snapshot must include the native installer's managed
  # toolchain dirs even when the session PATH is missing them (GUI-launched
  # Claude never sources the shell-profile block that wires them in).
  # US-001: canonical YAML-backed validation for shipped skill metadata and
  # generated agents/openai.yaml contracts.
  agent-runtime-skill-metadata:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: agent-runtime-skill-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned YAML parser for skill metadata contracts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/agent-runtime-parser"
          node core/scripts/validate-agent-runtime-contracts.mjs install-parser --install-dir "$install_dir"
          echo "HQ_AGENT_RUNTIME_PARSER_ROOT=$install_dir" >> "$GITHUB_ENV"
      - name: Validate shipped skill metadata + openai.yaml
        run: node core/scripts/validate-agent-runtime-contracts.mjs
      - name: Skill metadata regression test
        run: bash core/scripts/tests/agent-runtime-skill-metadata.test.sh
      - name: export-skill-catalog wrapper regression test
        run: bash core/scripts/tests/export-skill-catalog.test.sh
      - name: Validate concrete shipped skill command permissions
        run: node core/scripts/validate-agent-runtime-contracts.mjs validate-permissions
      - name: Skill command permission regression test
        run: bash core/scripts/tests/agent-runtime-permissions.test.sh
      - name: Install ShellCheck for cross-runtime shell contracts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck cross-runtime adapters and fixtures
        run: |
          shellcheck -S warning \
            core/scripts/hook-lib.sh \
            core/scripts/lint-shell-portability.sh \
            core/scripts/tests/agent-runtime-skill-metadata.test.sh \
            core/scripts/tests/agent-runtime-permissions.test.sh \
            core/scripts/tests/hook-runtime-diagnostics.test.sh \
            core/scripts/tests/agent-runtime-contracts-e2e.test.sh \
            .claude/hooks/hook-gate.sh \
            .claude/hooks/check-claude-desktop-bridge-health.sh \
            .codex/hooks/hq-codex-hook-adapter.sh \
            .grok/hooks/hq-grok-hook-adapter.sh
      - name: Claude Codex Grok Cowork runtime contract matrix
        run: bash core/scripts/tests/agent-runtime-contracts-e2e.test.sh

  compose-settings-path:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: compose-settings-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: settings.json PATH snapshot composition
        run: bash core/scripts/tests/compose-settings-path.test.sh

  agent-session-resume:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The resume store is what lets a user revive a Slack thread days later, and
    # its records are the only handle any sweep has on a conversation. These
    # suites existed but nothing ran them on a PR — this job is that gate.
    name: agent-session-resume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resume store round-trip, TTL, and discard paths
        run: bash core/scripts/tests/hq-agent-session-resume.test.sh
      - name: Conversation descriptor on resume records
        run: bash core/scripts/tests/hq-agent-session-resume-descriptor.test.sh
      - name: Resume wiring through a real turn (incl. descriptor callsite)
        run: bash core/scripts/tests/hq-agent-session-resume-wiring.test.sh
      - name: Multi-line /slash never dispatches a skill
        run: bash core/scripts/tests/hq-agent-session-skill-dispatch-multiline.test.sh

  hook-health-prevention:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1942: project hook configuration can be absent or never loaded in
    # Desktop/SDK sessions. Keep the independent doctor, release-overlay
    # contract, and remediation docs from drifting together.
    name: hook-health-prevention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook health checker behavior
        run: bash core/scripts/tests/hook-health-check.test.sh
      - name: Hook settings release contract
        run: bash core/scripts/tests/hook-settings-release-contract.test.sh

  # US-015: check-client-health runs on EVERY session start, spawns detached
  # background work, and can file bug reports on the user's behalf. Pin that a
  # healthy install stays silent, a degraded one remediates exactly once per
  # cooldown, HQ_DISABLED_HOOKS opts out, the hook never exits non-zero, and its
  # doctor-JSON parsing is python-free on both engines.
  client-health-hook:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: client-health-hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: check-client-health behaviour (detection, cooldown, opt-out, engines)
        run: bash core/scripts/tests/check-client-health.test.sh

  # feedback_4e67345c: an unquoted project-root path in a hook command is
  # word-split by /bin/sh, so every hook dies non-blocking and silent on an
  # install path containing a space. The guard existed but ran in no workflow.
  hook-path-resolution:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hook-path-resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Hook commands resolve from an install path containing spaces
        run: bash core/scripts/tests/hook-path-resolution.test.sh
      - name: ensure-hq-cli hook detects/install/PATH-fixes the CLI
        run: bash core/scripts/tests/ensure-hq-cli-hook.test.sh
      - name: ensure-hq-desktop hook detects/updates the desktop app
        run: bash core/scripts/tests/ensure-hq-desktop-hook.test.sh

  # feedback_3cdd3064: deploy-summary.sh aborted under set -u when HQ_DEPLOY_API was unset.
  deploy-summary-nounset:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: deploy-summary-nounset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy-summary.sh tolerates unset HQ_DEPLOY_API under set -u
        run: bash core/scripts/tests/deploy-summary-nounset.test.sh

  # task-3517155514: /deploy must always resolve a non-empty API base (public
  # default https://api.indigo-hq.com) so a fresh install does not stall at Phase C.
  resolve-deploy-api:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: resolve-deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy API base always resolves (public-default fallback)
        run: bash core/scripts/tests/resolve-deploy-api.test.sh

  # task-2854627137: /deploy org resolution must work for AGENT callers (agt_),
  # not just humans — else an agent's company deploy silently downgrades to personal.
  resolve-deploy-org:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: resolve-deploy-org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy org resolves for agent + human callers (via /membership/me)
        run: bash core/scripts/tests/resolve-deploy-org.test.sh

  # US-001: /deploy identity-resolve portable USER key + TMPDIR lock (#357 regression).
  identity-resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: identity-resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: identity-resolve USER/USERNAME lock path
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh

  # US-001: identity-resolve jq→node fallback; missing engines → missing_dependency not login_required.
  identity-resolve-missing-jq:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: identity-resolve-missing-jq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: identity-resolve node fallback + missing_dependency
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh

  # US-002: shared OS portability helpers (stat/sed/tmp/user/require_jq).
  portable-lib:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: portable-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable.sh helpers
        run: bash core/scripts/tests/portable-lib.test.sh

  # feedback_1b307a08: nested manifests were misparsed by a flat col-0 regex.
  manifest-nested-parse:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: manifest-nested-parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nested company manifest parsing
        run: bash core/scripts/tests/manifest-nested-parse.test.sh

  # feedback_c930eafe: catch stale org chart drift between README teams and person ontology.
  ontology-readme-drift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: ontology-readme-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: README team table matches person ontology
        run: bash core/scripts/tests/ontology-readme-drift.test.sh

  git-pack-extension:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # A packfile set is paired BY EXTENSION (pack-<sha>.pack/.idx/.rev). Strip
    # the extension off one of them and git stops seeing the whole set: the
    # objects are intact on disk but report as missing, so the repo presents as
    # catastrophic history loss when the actual repair is a rename. Observed on
    # a macOS HQ root alongside Finder Icon\r cruft. The suite asserts against
    # real repos and real packfiles — it builds the breakage, proves git fails,
    # then proves the repair makes git healthy again.
    name: git-pack-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: De-extensioned packfile detection and repair
        run: bash core/scripts/tests/git-pack-extension-check.test.sh

  git-mutation-guard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1765: the HQ-root git-mutation guard must FIRE correctly under BOTH
    # harnesses. Under Codex the adapter used to resolve HQ_ROOT from the cwd's
    # git toplevel, which collapses into a nested repo (repos/*), missed the
    # gate, and exited 0 — silently allowing `cd <hq-root> && git push` from a
    # nested cwd. Claude side: block-hq-root-git-mutation.test.sh. Codex side:
    # codex-git-mutation-firing.test.sh (real adapter + gate + hook, no stubs).
    name: git-mutation-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claude-harness git-mutation guard
        run: bash core/scripts/tests/block-hq-root-git-mutation.test.sh
      - name: Codex-harness git-mutation guard fires
        run: bash core/scripts/tests/codex-git-mutation-firing.test.sh
      - name: Codex hook adapter routes mandatory scope authorizer
        run: bash core/scripts/test-codex-hook-adapter.sh

  # ---------------------------------------------------------------------------
  # B4 (feedback_b16e277b): the autocommit hook ended every git call with
  # `|| exit 0` and the handoff finalizer reported a refused commit inside an
  # exit-0 success payload, so a wedged .git/index.lock stopped all HQ writes
  # for hours with zero signal. Neither suite was wired into CI before.
  #
  # These five suites used to run back to back in ONE job that took 6.4 min and
  # was the single longest job in this 61-job workflow — so it alone set the
  # whole workflow's wall clock (measured 2026-08-17: 6.3 min of a 6.5 min run).
  # The breakdown was 1.9 min to install the hq CLI, 2.7 min for the qmd reindex
  # suite, and 1.7 min for the other four together.
  #
  # The qmd suite is therefore split onto its own runner so it stops queueing
  # behind the handoff suites. Both jobs keep the hq CLI install: four of the
  # five suites reference a core/scripts CLI forwarder (hq-status-summary.sh,
  # rebuild-threads-index.sh, rebuild-orchestrator-index.sh, qmd-reindex-bg.sh,
  # archive-old-threads.sh), and forwarder-ci-contract.test.sh requires every
  # job running such a suite to carry the install/validation step. Do NOT try to
  # drop the install from the handoff job on the grounds that its scripts never
  # type `hq` directly — they reach it THROUGH those forwarders, which is
  # precisely the false negative that contract exists to catch.
  #
  # `autosave-failure-visibility` below is the aggregating gate and keeps the
  # name: branch protection matches on check NAME, so the aggregator is what
  # makes splitting these legs safe to do again later.
  # ---------------------------------------------------------------------------
  autosave-failure-visibility-handoff:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: autosave-failure-visibility (handoff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Autocommit hook surfaces git failures and stays quiet otherwise
        run: bash core/scripts/tests/hq-autocommit.test.sh
      - name: Handoff finalizer never reports a failed commit as success
        run: bash core/scripts/tests/handoff-finalize-commit-status.test.sh
      - name: Handoff finalizer smoke
        run: bash core/scripts/tests/handoff-finalize-smoke.sh
      - name: Handoff finalizer accepts a large file-backed changeset
        run: bash core/scripts/tests/handoff-finalize-large-changeset.test.sh

  autosave-failure-visibility-qmd-reindex:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: autosave-failure-visibility (qmd-reindex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Handoff qmd reindex ownership (agent skip + laptop single-flight)
        run: bash core/scripts/tests/qmd-handoff-reindex.test.sh

  # Aggregating gate. Green ONLY if BOTH legs above succeeded — a skipped or
  # cancelled leg reds this too, so the split cannot silently drop a suite.
  autosave-failure-visibility:
    name: autosave-failure-visibility
    needs:
      - autosave-failure-visibility-handoff
      - autosave-failure-visibility-qmd-reindex
    if: ${{ (always()) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Every autosave-failure-visibility leg passed
        run: |
          set -euo pipefail
          handoff='${{ needs.autosave-failure-visibility-handoff.result }}'
          qmd='${{ needs.autosave-failure-visibility-qmd-reindex.result }}'
          echo "handoff=$handoff qmd-reindex=$qmd"
          rc=0
          [ "$handoff" = "success" ] || rc=1
          [ "$qmd" = "success" ] || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: an autosave-failure-visibility leg did not succeed." >&2
            exit 1
          fi

  journal-session-isolation:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: journal-session-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Session-scoped journal pointers and ownership validation
        run: bash core/scripts/tests/journal-session-scoped-pointer.test.sh
      - name: Stop hook selects only its session journal
        run: bash core/scripts/tests/after-turn-suggestions.test.sh
      - name: Context checkpoint hooks
        run: bash core/scripts/tests/context-checkpoint-hooks.test.sh
      # The Stop-gate regression supplies its own hq shim; do not install hq here.
      - name: Checkpoint Stop gate
        run: bash core/scripts/tests/checkpoint-stop-gate.test.sh
      - name: Checkpoint and journal hooks do not over-trigger
        run: bash core/scripts/tests/checkpoint-journal-noise.test.sh
      - name: Session id resolves to this process, not .current
        run: bash core/scripts/tests/session-id.test.sh
      - name: Session scope capability mint/read contract
        run: bash core/scripts/tests/session-scope-capability.test.sh
      - name: Mandatory scope authorizer blocks cross-company access
        run: bash core/scripts/tests/mandatory-scope-authorizer.test.sh
      - name: hq-session mints scope capability on company bind
        run: bash core/scripts/tests/hq-session.test.sh
      - name: Bounded-action scope contract (Claude+Codex shared text)
        run: bash core/scripts/tests/startwork-bounded-action-contract.test.sh
      - name: Company infra policy reminder follows the firing session
        run: bash core/scripts/tests/surface-company-infra-policy.test.sh

  mcp-cleanup-session-scope:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: mcp-cleanup-session-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop-hook cleanup stays inside its own session tree
        run: bash core/scripts/tests/cleanup-mcp-session-scope.test.sh

  hq-agent-session-harness:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # US-411 assembly timing budget + US-412 golden-turn parity harness.
    name: hq-agent-session-harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assembly timing budget (US-411)
        run: bash core/scripts/tests/hq-agent-session-timing.test.sh
      - name: Golden-turn parity harness (US-412)
        run: bash core/scripts/tests/hq-agent-session-parity.test.sh
      - name: Runtime-env regressions (first live fleet turn)
        run: bash core/scripts/tests/hq-agent-session-runtime-env.test.sh
      - name: Provider liveness heartbeat (idle-watchdog survival)
        run: bash core/scripts/tests/hq-agent-session-heartbeat.test.sh
      - name: Company authorization (fail-closed guards + pipefail regression)
        run: bash core/scripts/tests/hq-agent-session-authz.test.sh

  reindex-path-gate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Path-gated reindex hook: `hq reindex` must run ONLY when a skill, worker,
    # or personal-overlay entry (knowledge/policies/settings) is created,
    # edited, or deleted — not on every turn/prompt/session. Guards the gate in
    # .claude/hooks/reindex.sh against regressions.
    name: reindex-path-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reindex hook fires only on relevant file changes
        run: bash core/scripts/tests/reindex-path-gate.test.sh

  rebuild-threads-index:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Changeset sidecars share the T-*.json prefix but must never consume
    # INDEX.md rows or recent.md's 15-thread limit.
    name: rebuild-threads-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Rebuild qmd collections after sync
        run: bash core/scripts/tests/qmd-reindex-after-sync.test.sh
      - name: Index real-directory company knowledge
        run: bash core/scripts/tests/rebuild-company-knowledge-index.test.sh
      - name: Index orchestrator state
        run: bash core/scripts/tests/rebuild-orchestrator-index.test.sh
      - name: Index primary thread records only
        run: bash core/scripts/tests/rebuild-threads-index.test.sh

  auto-checkpoint-cmds:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Item 2: /brainstorm and /plan must auto-checkpoint at command end so users
    # do not have to manually /handoff before a fresh session. Structural guard.
    name: auto-checkpoint-cmds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Planning commands auto-checkpoint on completion
        run: bash core/scripts/tests/auto-checkpoint-planning-cmds.test.sh

  session-title-manual-backoff:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # feedback_0919db0c / feedback_1f573b9f: the session-title hook must stop
    # overwriting a user's manual title (launcher --name / /rename / desktop
    # rename). Primary back-off is the documented session_title SessionStart
    # input; the transcript custom-title scan is a labeled secondary net.
    name: session-title-manual-backoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manual /rename and --name titles are not clobbered
        run: bash core/scripts/tests/session-title-manual-backoff.test.sh

  knowledge-repo-glob-shells:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # knowledge-repo-loop-zsh-unmatched-glob: the checkpoint and cleanup
    # snippets must not let zsh NOMATCH abort on an empty knowledge directory.
    name: knowledge-repo-glob-shells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh for NOMATCH regression coverage
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Knowledge repository glob expansion is shell-safe
        run: bash core/scripts/tests/knowledge-repo-glob-shells.test.sh

  knowledge-scaffold-real-dir:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Knowledge repositories must be real canonical directories everywhere;
    # setup/import/docs may never recreate the legacy repo-symlink layout.
    name: knowledge-scaffold-real-dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Knowledge repositories use real directories with sync-visible content
        run: bash core/scripts/tests/knowledge-scaffold-real-dir.test.sh

  dm-people-resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # feature-dm-skill-email-confirm: the /dm skill must CONFIRM a recipient's
    # email via `hq people resolve` (single-company, tenancy-safe) before
    # sending — never send to an unconfirmed name. Structural guard over the
    # dm SKILL.md instruction contract.
    name: dm-people-resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: /dm confirms recipient email via hq people resolve before sending
        run: bash core/scripts/tests/dm-people-resolve-integration.test.sh

  auto-acl-share-hooks:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: auto-acl-share-hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Detector smoke test
        run: bash core/scripts/tests/auto-acl-suggest.test.sh
      - name: Stop reminder smoke test
        run: bash core/scripts/tests/auto-acl-share-reminder.test.sh
      - name: Hooks parse + no bash-3.2 nested-heredoc (DEV-1513f1f5)
        run: bash core/scripts/tests/hooks-heredoc-syntax.test.sh
      - name: Supply-chain guard bypass is env-only, not inline prefix (DEV-1798)
        run: bash core/scripts/tests/block-unsafe-package-install.test.sh
      - name: Workers-registry quarantine semantics + pack-sourced remedy (DEV-1718, DEV-1796)
        run: bash core/scripts/tests/generate-workers-registry.test.sh
      - name: Pack scan host-wins collision + inline-copy refusal
        run: bash core/scripts/tests/scan-packages-engineering.test.sh
      - name: Pack scan worker-id collision
        run: bash core/scripts/tests/scan-packages-id-collision.test.sh

  previously-unrun-suites:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # These suites existed but were never wired into CI, so they rotted
    # unnoticed: audit-log-mkdir had been failing outright since audit-log.sh
    # gained a lib/portable.sh dependency the fixture never copied.
    name: previously-unrun-suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: audit-log append creates its metrics dir on a clean tree
        run: bash core/scripts/tests/audit-log-mkdir.test.sh
      - name: release-guidance command references resolve
        run: bash core/scripts/tests/skill-command-refs.test.sh

  core-write-protection:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: core-write-protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hook-gate self-heals a non-executable (sync-stripped) hook
        run: bash core/scripts/tests/hook-gate-exec-bit.test.sh
      - name: Runtime adapters repair hooks or emit bounded diagnostics
        run: bash core/scripts/tests/hook-runtime-diagnostics.test.sh
      - name: hook-gate augments PATH for version-manager node (nvm/volta/fnm/asdf)
        run: bash core/scripts/tests/hook-gate-path-augment.test.sh
      - name: All tracked .sh files are mode 100755 in the git index (US-004)
        run: bash core/scripts/tests/exec-bit-all-scripts.test.sh
      - name: block-core-writes-bash exempts repos/ checkouts, still guards live root
        run: bash core/scripts/tests/block-core-writes-repos-exempt.test.sh
      - name: block-core-writes-bash target-aware write detection
        run: bash core/scripts/tests/block-core-writes-bash.test.sh
      - name: block-core-writes permits only the durable native personal context
        run: bash core/scripts/tests/block-core-writes-native-context.test.sh
      - name: block-core-writes keeps package contribution links immutable
        run: bash core/scripts/tests/block-core-writes-package-mount.test.sh
      - name: block-repo-edits admits only workspace/worktrees, no exemptions
        run: bash core/scripts/tests/block-repo-edits-strict.test.sh
      - name: HQ worktree guard distinguishes canonical Windows path aliases
        run: bash core/scripts/tests/block-hq-worktree-session.test.sh
      - name: enforce-vault-write-access blocks mutations without vault write permission
        run: bash core/scripts/tests/enforce-vault-write-access.test.sh
      - name: refresh-vault-access builds the manifest the write-access hook consumes
        run: bash core/scripts/tests/refresh-vault-access.test.sh

  # US-005: shell portability lint + shellcheck + cross-platform smoke.
  shell-portability:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: shell-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint-shell-portability
        run: bash core/scripts/lint-shell-portability.sh
      - name: lint-shell-portability regression test
        run: bash core/scripts/tests/lint-shell-portability.test.sh
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck portability surface (warning; this-PR shell paths)
        run: |
          set -euo pipefail
          # Scope to the cross-platform surface introduced/touched by this work.
          # Full-tree shellcheck is a separate burn-down (pre-existing SC noise).
          files=(
            core/scripts/lib/portable.sh
            core/scripts/lint-shell-portability.sh
            core/scripts/rebuild-threads-index.sh
            core/scripts/tests/rebuild-threads-index.test.sh
            core/scripts/setup.sh
            core/scripts/repo-run-registry.sh
            core/scripts/rebuild-social-drafts-index.sh
            core/scripts/audit-log.sh
            .claude/hooks/hook-gate.sh
            .claude/skills/deploy/scripts/identity-resolve.sh
            .claude/skills/deploy/scripts/password-helper.sh
            .claude/skills/deploy/scripts/resolve-deploy-org.sh
          )
          present=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          echo "shellcheck ${#present[@]} files"
          shellcheck -S warning "${present[@]}"

  shell-smoke-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: shell-smoke-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: portable-lib
        run: bash core/scripts/tests/portable-lib.test.sh
      - name: identity-resolve USER key
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh
      - name: identity-resolve missing engines
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh
      - name: exec-bit index
        run: bash core/scripts/tests/exec-bit-all-scripts.test.sh
      - name: hook-gate path augment
        run: bash core/scripts/tests/hook-gate-path-augment.test.sh
      - name: hook-gate exec-bit self-heal
        run: bash core/scripts/tests/hook-gate-exec-bit.test.sh
      - name: install pinned YAML parser for agent runtime contracts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/agent-runtime-parser"
          node core/scripts/validate-agent-runtime-contracts.mjs install-parser --install-dir "$install_dir"
          echo "HQ_AGENT_RUNTIME_PARSER_ROOT=$install_dir" >> "$GITHUB_ENV"
      - name: validate shipped skill metadata + openai.yaml
        run: node core/scripts/validate-agent-runtime-contracts.mjs

  shell-smoke-macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: shell-smoke-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: portable-lib
        run: bash core/scripts/tests/portable-lib.test.sh
      - name: identity-resolve USER key
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh
      - name: identity-resolve missing engines
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh
      - name: exec-bit index
        run: bash core/scripts/tests/exec-bit-all-scripts.test.sh
      - name: hook-gate path augment
        run: bash core/scripts/tests/hook-gate-path-augment.test.sh
      - name: hook-gate exec-bit self-heal
        run: bash core/scripts/tests/hook-gate-exec-bit.test.sh

  hooks-no-python:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # HQ's runtime hook layer must not depend on python3 (Windows machines
    # often have none — or the Store alias stub that resolves on PATH but
    # cannot run). Tripwire (no python3 invocations in runtime hooks/scripts),
    # hook-lib engine parity (jq vs node), and broken-python3 runtime proof
    # for policy injection + the frontmatter validator.
    name: hooks-no-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hooks run python-free (tripwire + parity + broken-stub runtime)
        run: bash core/scripts/tests/hooks-no-python.test.sh

  policy-trigger-migration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Trigger-less soft/unset policies must not be promoted into the always-on
    # SessionStart baseline; hard fallback and normal reactive injection stay live.
    name: policy-trigger-migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforcement-gated policy trigger backfill
        run: bash core/scripts/tests/migrate-policy-triggers.test.sh
      - name: Retired digest path has no frontmatter exemption
        run: bash core/scripts/tests/validate-policy-frontmatter.test.sh
      - name: Emit contract — tsv shape, scope precedence, enforcement-tiered depth
        run: bash .claude/hooks/tests/inject-policy-on-trigger-emit.test.sh
      - name: Policy trigger end-to-end corpus coverage
        run: bash core/scripts/tests/inject-policy-e2e.test.sh
      - name: Inject cadence (once vs always) + PreCompact ledger purge
        run: bash core/scripts/tests/inject-policy-always-inject.test.sh

  personal-policy-overlay:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The personal→core policy mirror is retired: the trigger hook must read
    # personal/policies DIRECTLY (no core/policies symlink mirror), and the
    # drift detector must classify + prune only behavior-neutral orphan copies
    # while never touching a diverged twin or a core-only shipped policy.
    name: personal-policy-overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: personal/policies is read directly by the trigger hook (no mirror)
        run: bash core/scripts/tests/personal-policy-overlay.test.sh
      - name: stale core/policies mirror detector classifies + prunes safely
        run: bash core/scripts/tests/detect-stale-core-policy-mirror.test.sh

  stale-review-base:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # An HQ root that is a git repo with a remote attached drifts thousands of
    # autosave commits ahead of its remote-tracking ref (HQ is never pushed).
    # A review tool that auto-selects a base picks that ref and builds a
    # whole-tree diff from it — the 2026-07-28 Codex desktop git-worker SIGTRAP.
    # The detector must flag those refs and repair them WITHOUT touching local
    # branches, the configured remote, or any repos/ clone.
    name: stale-review-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stale review-base detector reports + repairs safely
        run: bash core/scripts/tests/detect-stale-review-base.test.sh
      - name: session-start hook auto-repairs installs and spares clones
        run: bash core/scripts/tests/repair-stale-review-base-hook.test.sh

  prefer-native-capabilities:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # hq-prefer-native-capabilities must inject at session start (always-on
    # baseline) and on canvas/share/secret prompts, stay untruncated in the
    # policy-reminder, and pass frontmatter validation (US-001).
    name: prefer-native-capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install hq CLI for forwarded scaffold scripts
        run: |
          set -euo pipefail
          npm install -g @indigoai-us/hq-cli
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but hq was not installed on PATH." >&2
            exit 1
          fi
          if ! hq core --help >/dev/null 2>&1; then
            echo "ERROR: This job depends on a released @indigoai-us/hq-cli containing the hidden core group (hq-cli#279), but the installed hq CLI does not provide it." >&2
            exit 1
          fi
      - name: Policy fires on SessionStart + canvas prompt (trigger battery)
        run: bash core/scripts/tests/prefer-native-capabilities-trigger.test.sh
      - name: Codex preflight pull path emits the policy + Grok rules pointer
        run: bash core/scripts/tests/codex-preflight-policies.test.sh
      - name: Codex output-style bridge
        run: bash core/scripts/tests/codex-output-style-bridge.test.sh

  forwarder-ci-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Forwarder tests depend on the released hq CLI. This contract keeps the
    # workflow install steps synchronized with every test that references one.
    name: forwarder-ci-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every forwarder-dependent test has an hq CLI job
        run: bash core/scripts/tests/forwarder-ci-contract.test.sh

  work-mesh-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Wire the company-work-corpus hook suites explicitly without enabling
    # unrelated legacy scripts in the broader tests directory.
    name: work-mesh-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Work Mesh client-hook test scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(core/scripts/tests/work-mesh-*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no core/scripts/tests/work-mesh-*.test.sh found" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            bash "$t"
          done

  work-mesh-v2:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: work-mesh-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work Mesh watcher unit contract
        run: node --test core/scripts/__tests__/work-mesh.test.mjs
      - name: Work Mesh watcher US-011 acceptance
        run: node --test test/__tests__/stories/US-011.test.mjs
      - name: Work Mesh helper compatibility smoke
        run: bash core/scripts/tests/work-mesh-helper.test.sh

  doctor-advisory-summary:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # US-014 (hq-doctor): unit + contract coverage for the advisory CI helper
    # that renders the `hq doctor --json` PR comment. Guards the diff-against-base
    # logic, the update-in-place comment selection, and the doctor-advisory.yml
    # workflow contract (paths filter, advisory exit-0, github-script wiring)
    # against regressions.
    name: doctor-advisory-summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Advisory summary helper unit + workflow contract
        run: node --test core/scripts/__tests__/doctor-ci-summary.test.mjs

  workflow-runner:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The engine-neutral workflow runner (core/scripts/workflow-runner.mjs) and
    # the /orchestrate pipeline it drives. Both suites are hermetic — fake engine
    # binaries, synthetic HQ root, no network — and run in ~25s each. Wired into
    # CI alongside the codex strict-output-schema fix: the provider rejects any
    # object node without additionalProperties:false or with an incomplete
    # `required` (HTTP 400 invalid_json_schema), which killed the first agent of
    # every codex-engine run, so the guard belongs somewhere mechanical.
    name: workflow-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Codex strict output-schema adapter (unit)
        run: node --test core/scripts/__tests__/codex-output-schema.test.mjs
      - name: Workflow runner — codex / grok / claude engines + gates
        run: bash core/scripts/tests/workflow-runner.test.sh
      - name: Orchestrate pipeline E2E (fake engines)
        run: bash core/scripts/tests/orchestrate-pipeline.test.sh

  # ─── Label-gated checks ────────────────────────────────────────────
  core-yaml-version-monotonic:
    # hq-core ONLY. Promote PRs (the only kind hq-core sees) always bump
    # core/core.yaml hqVersion via promote-to-hq-core.yml; this check enforces
    # that the bump is strictly greater than origin/main. Staging is exempt —
    # staging churns intra-version without bumping hqVersion.
    name: core-yaml-version-monotonic
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'indigoai-us/hq-core') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: core/core.yaml hqVersion must strictly increase
        run: bash .leak-scan/scan.sh core-yaml-version-monotonic

  pr-author-hq-audit-bot:
    # hq-core ONLY. The only PRs hq-core ever receives are the promote/backmerge
    # PRs opened by the hq-audit-bot App (see promote-to-hq-core.yml). Any PR
    # authored by a human — or any other bot — is illegitimate on hq-core and
    # must be blocked from merging: real work lands on hq-core-staging and is
    # promoted here by the bot. Staging is exempt (the job is skipped there),
    # so human contributors are never blocked on staging.
    #
    # This file is promoted into hq-core verbatim; the repository guard keeps
    # the job inert on staging. To actually block merges, this job's name
    # ("pr-author-hq-audit-bot") must be listed as a required status check in
    # hq-core's main_protect ruleset.
    name: pr-author-hq-audit-bot
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'indigoai-us/hq-core') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: PR author must be the hq-audit-bot App
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            hq-audit-bot|"hq-audit-bot[bot]")
              echo "PR author '$PR_AUTHOR' is the HQ audit bot — allowed."
              ;;
            *)
              echo "::error::PR author '${PR_AUTHOR}' is not the HQ audit bot. indigoai-us/hq-core only accepts PRs opened by hq-audit-bot (promoted from hq-core-staging). Open your change against hq-core-staging instead."
              exit 1
              ;;
          esac

  # ─── Codex-augmented semantic check ────────────────────────────────
  # Per-file PASS/EDIT/DROP rubric, mirroring /promote-hq-core Phase 3.
  # Dynamic matrix over changed policy files; capped at 10 in parallel
  # to match the local batching rule.

  collect-policy-changes:
    name: collect-policy-changes
    if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.collect.outputs.files }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: collect
        name: List changed core/policies/*.md files
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          git fetch origin "$base" --depth=1
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "origin/$base"...HEAD \
            | grep -E '^\core/policies/[^/]+\.md$' || true)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "files=[]" >> "$GITHUB_OUTPUT"
            echo "count=0"  >> "$GITHUB_OUTPUT"
          else
            json="$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)"
            echo "files=$json" >> "$GITHUB_OUTPUT"
            echo "count=${#changed[@]}" >> "$GITHUB_OUTPUT"
          fi

  codex-pii-rubric:
    name: codex-pii-rubric
    needs: collect-policy-changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.collect-policy-changes.outputs.count != '0' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-codex-rubric')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.collect-policy-changes.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install codex CLI
        run: npm i -g @openai/codex
      - name: Run rubric on ${{ matrix.file }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_MODEL: gpt-5
        run: |
          set -euo pipefail
          out="$(bash .leak-scan/codex-rubric.sh "${{ matrix.file }}")"
          echo "$out"
          # Append to job summary so reviewers see verdicts collated
          {
            echo "## Rubric: ${{ matrix.file }}"
            echo '```json'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Provider adapter contract (US-504) ─────────────────────────────
  #
  # One job covering the whole adapter surface: cross-provider parity, the
  # three per-adapter suites, and the capability-snapshot drift check.
  #
  # WHY THE SNAPSHOT CHECK IS HERE AND NOT OPTIONAL. capabilities.generated.json
  # is the only mechanism by which hq-pro control-plane TypeScript can read a
  # descriptor that otherwise exists solely as bash on an agent box. If it goes
  # stale, the control plane routes work using capabilities the fleet no longer
  # has -- e.g. sending a plan turn to a provider that has since declared
  # plan_mode=absent. The failure is silent in production and cheap to catch here.
  #
  # Toolchain is bash + jq only (both preinstalled on ubuntu-latest), per the
  # story's constraint -- no node, no package install, nothing to drift.
  provider-adapter-contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: provider-adapter-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paths filter, implemented in bash rather than a marketplace action so
      # the job keeps its bash+jq-only guarantee and gains no new dependency.
      #
      # provider-adapter-version.sh is included beyond the story's literal path
      # list on purpose: a contract-version bump changes the snapshot's
      # contractVersion field without touching any adapter file, so filtering
      # on the adapters alone would let that specific drift through unnoticed.
      - name: Decide whether adapter contract files changed
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            changed="$(git diff --name-only "$base"...HEAD || true)"
          else
            changed="$(git diff --name-only HEAD~1 HEAD || true)"
          fi
          echo "$changed" | grep -qE '^core/scripts/lib/provider-adapter\.sh$|^core/scripts/lib/provider-adapters/|^core/scripts/lib/provider-adapter-version\.sh$|^core/scripts/generate-adapter-capabilities\.sh$|^core/scripts/tests/provider-adapter-|^core/scripts/tests/probes/|^core/scripts/codex-preflight\.sh$|^core/scripts/convert-codex\.sh$|^core/scripts/tests/codex-sandbox-danger-full-access\.test\.sh$|^core/workers/public/dev-team/|^\.claude/scripts/run-project\.sh$|^\.claude/skills/execute-task/SKILL\.md$' \
            && echo "run=true" >> "$GITHUB_OUTPUT" \
            || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Cross-provider parity conformance
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-parity.test.sh

      - name: codex adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-codex.test.sh

      - name: codex sandbox danger-full-access (finding 2.3)
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/codex-sandbox-danger-full-access.test.sh

      - name: grok adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-grok.test.sh

      - name: claude adapter suite
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-claude.test.sh

      - name: Capability snapshot is not stale
        if: steps.filter.outputs.run == 'true'
        run: bash core/scripts/tests/provider-adapter-capabilities-snapshot.test.sh
