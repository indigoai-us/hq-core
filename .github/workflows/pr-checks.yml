        run: bash core/scripts/tests/claude-bg-shell-pressure-reap-trigger.test.sh
      - name: hq monitor policy trigger contract
        run: bash core/scripts/tests/hq-monitor-policy-trigger.test.sh
      - name: hq monitor guard and delivery hook contract
        run: bash core/scripts/tests/hq-monitor-hooks.test.sh
      - name: hq monitor guard PATH-shim process budget
        run: bash .claude/hooks/tests/hq-monitor-guard-process-budget.test.sh
      - name: Codex preflight pull path emits the policy + Grok rules pointer
        run: bash core/scripts/tests/codex-preflight-policies.test.sh
