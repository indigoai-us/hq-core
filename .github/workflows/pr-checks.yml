name: pr-checks

# Ports the /promote-hq-core local rule set to PR-time CI. Each job maps to
# a named HQ policy — failure annotations include the policy slug so the
# contributor can find the rule. See:
#   core/policies/hq-cmd-promote-hq-core-*.md (in HQ)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Mechanical checks (no LLM) ─────────────────────────────────────

  denylist-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: denylist-scan
    runs-on: ubuntu-24.04-arm
    outputs:
      macos_shell_smoke: ${{ steps.shell_smoke_macos_paths.outputs.run }}
      windows_shell_smoke: ${{ steps.shell_smoke_windows_paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert cost-efficient Linux runner labels
        run: bash core/scripts/tests/runner-cost-arm-labels.test.sh
      - name: Detect changes covered by the macOS shell smoke job
        id: shell_smoke_macos_paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash core/scripts/ci/should-run-macos-shell-smoke.sh \
            "$base_sha" "$GITHUB_SHA" "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Detect Windows shell smoke and skill-runtime inputs
        id: shell_smoke_windows_paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          bash core/scripts/ci/should-run-windows-shell-smoke.sh \
            "$base_sha" "$GITHUB_SHA" "$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
      - name: Shell smoke platform path filter regression test
        run: bash core/scripts/tests/shell-smoke-macos-paths.test.sh
      - name: Shell smoke timeout runner overlap and failure regression test
        run: bash core/scripts/tests/shell-smoke-timeout-runner.test.sh
      - name: Codex policy rubric batching workflow contract
        run: bash core/scripts/tests/cost-workflow-pr-checks.test.sh
      - name: Release promotion checks gate regression test
        run: bash core/scripts/tests/release-pr-check-gate.test.sh
      - name: US-016 Tart VM harness stub regression test
        run: bash core/scripts/tests/anywhere-vm-test.test.sh
      - name: Run denylist scan
        run: bash .leak-scan/scan.sh denylist

  policy-rationale-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: policy-rationale-scan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run policy-rationale scan
        run: bash .leak-scan/scan.sh policy-rationale

  slug-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: slug-scan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run private tenant slug scan
        run: bash .leak-scan/scan.sh slugs

  users-path-tripwire:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: users-path-tripwire
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: /Users/ absolute-path tripwire
        run: bash .leak-scan/scan.sh users-path

  provenance-stripped:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: provenance-stripped
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ## Provenance section must not be present
        run: bash .leak-scan/scan.sh provenance

  vendor-public-ok:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: vendor-public-ok
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor-scoped policies need vendor_public_ok
        run: bash .leak-scan/scan.sh vendor-public-ok

  public-frontmatter-revalidate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: public-frontmatter-revalidate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-validate public:true frontmatter
        run: bash .leak-scan/scan.sh public-frontmatter

  denylist-drift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: denylist-drift
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Denylist must mirror HQ manifest snapshot
        run: bash .leak-scan/scan.sh denylist-drift

  settings-local-not-ignored:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: settings-local-not-ignored
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: .claude/settings.local.json must not be gitignored
        run: bash .leak-scan/scan.sh settings-local-not-ignored

  repos-segment-not-ignored:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: repos-segment-not-ignored
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: nested knowledge/repos/ must sync; only top-level repos/ excluded (DEV-1791)
        run: bash .leak-scan/scan.sh repos-segment-not-ignored

  instance-artifacts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: instance-artifacts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: workspace/ and personal/ ship only scaffold — no session/operator instance state
        run: bash .leak-scan/scan.sh instance-artifacts
      - name: Regression test (fixture clean/leak cases + live tree)
        run: bash core/scripts/tests/leak-scan-instance-artifacts.test.sh

  skill-command-refs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1716: a core skill must not instruct a slash-command that isn't
    # resolvable on the install it is shown to. Engineering commands
    # (/run-project, /execute-task, ...) live in the separately-installed
    # hq-pack-engineering and must be allowlisted (+ referenced with their
    # install line), never presented as always-available. Catches FUTURE
    # dangling references, not just the originally-reported skills.
    name: skill-command-refs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core skills only instruct resolvable commands
        run: bash core/scripts/lint-skill-command-refs.sh

  hq-sync-post-pull-reindex:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hq-sync-post-pull-reindex
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Refresh company skill wrappers after hq-sync pulls
        run: bash core/scripts/tests/hq-sync-post-pull-reindex.test.sh

  skill-script-refs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # WC-17: a skill must not retain a path to a shell script removed with a
    # retired workflow; commands and local script references are both released
    # guidance that must resolve on a fresh scaffold.
    name: skill-script-refs
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Core skills only reference shipped local shell scripts
        run: |
          bash core/scripts/lint-skill-script-refs.sh handoff
          bash core/scripts/lint-skill-script-refs.sh checkpoint
          bash core/scripts/lint-skill-script-refs.sh learn
          bash core/scripts/lint-skill-script-refs.sh resumework
          bash core/scripts/lint-skill-script-refs.sh startwork
          bash core/scripts/lint-skill-script-refs.sh conduct
      - name: /import-context redactor and synthetic scan output
        run: bash core/scripts/tests/import-context-redact.test.sh
      - name: /conduct session worker pool (cap, resume, recycle)
        run: bash core/scripts/tests/conduct-pool.test.sh
      - name: /conduct lane drop box (queue, claim, per-event hook output)
        run: bash core/scripts/tests/conduct-inbox.test.sh
      - name: /conduct worker selection (registry fields, definition load)
        run: bash core/scripts/tests/conduct-worker-selection.test.sh
      - name: Ralph orchestrator policy (JSON contract kept, spawn-per-story gone)
        run: bash core/scripts/tests/ralph-orchestrator-policy.test.sh
      - name: Orchestrator skills claim pool slots (execute-task + run-project)
        run: bash core/scripts/tests/orchestrator-skills-use-pool.test.sh
      - name: Orchestrator skills dispatch detached lanes (run-project + conduct)
        run: bash core/scripts/tests/orchestrator-skills-dispatch-lanes.test.sh
      - name: Detached lanes are reaped when their orchestrator is gone
        run: bash core/scripts/tests/conduct-reap.test.sh
      - name: SessionStart reap hook is non-blocking, single-flight and rate-limited
        run: bash core/scripts/tests/conduct-reap-hook.test.sh
      - name: Conduct mode as the session default (auto-conduct SessionStart hook)
        run: bash core/scripts/tests/auto-conduct.test.sh
      - name: Regression test (fixture + all skills + allowlist + WC-17 fix)
        run: bash core/scripts/tests/skill-script-refs.test.sh
      - name: Shipped skills reference existing core scripts
        run: bash core/scripts/tests/skill-core-script-references.test.sh
      - name: Command reports gate expandable technical details
        run: bash core/scripts/tests/skill-plain-report.test.sh
      - name: Deploy skill app route and multipart helper contracts
        run: bash core/scripts/tests/deploy-skill-app-route.test.sh
      - name: Deploy request helper rejects errors and supports app multipart uploads
        run: bash core/scripts/tests/deploy-api-request.test.sh
      - name: App deploy artifact includes root API handlers
        run: bash core/scripts/tests/guardrails-check-app-api.test.sh
      - name: HQ feedback summary and verbatim report contract
        run: bash core/scripts/tests/hq-bug-skill.test.sh
      - name: HQ feedback submit path avoids cleanup and fixed heredoc delimiters
        run: bash core/scripts/tests/hq-bug-submit-no-rm.test.sh
      - name: /team-access heal contract (bare rows, hidden grants, DEV-3405, readback)
        run: bash core/scripts/tests/team-access-skill.test.sh
      - name: Pricing drift and refresh scripts (offline regression)
        run: bash core/scripts/tests/pricing-drift.test.sh
      - name: Shipped pricing.json matches the live GET /v1/pricing endpoint
        run: bash core/scripts/check-pricing-drift.sh
      - name: Auto-session project uses the exact company directory entry
        run: bash core/scripts/tests/auto-session-project.test.sh
      - name: Session title waits for project resolution and prunes stale markers
        run: bash core/scripts/tests/session-title-project-resolution.test.sh
      - name: Company resolver (session bind + whole-token prompt scan)
        run: bash core/scripts/tests/resolve-company.test.sh
      - name: Session auto-bind honors device-default company boundaries
        run: bash core/scripts/tests/session-auto-bind.test.sh
      - name: /resumework requires explicit confirmation for locked threads
        run: bash core/scripts/tests/resume-thread-lock.test.sh

  skill-command-script:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # A skill's command.sh runs on /<skill> with its output shown to the
    # operator only. Guards the two properties that make that safe: the output
    # never reaches model context, and a company's script never runs for
    # another company's session.
    name: skill-command-script
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: UserPromptSubmit command.sh dispatch (scope, isolation, bounds)
        run: bash core/scripts/tests/skill-command-script.test.sh

  company-seed-renderer:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: company-seed-renderer
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deterministic company starter renderer and /newcompany contract
        run: node --test core/scripts/__tests__/render-company-starter-files.test.mjs
      - name: /newcompany bootstrap and flag timeout contracts
        run: node --test core/scripts/__tests__/newcompany-bootstrap.test.cjs
      - name: HQ flag reader honors caller timeout budgets
        run: node --test core/scripts/__tests__/setup-path-flag-timeout.test.cjs

  setup-skill-direct-install:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # /setup must install missing CLI tools directly, never re-introduce the
    # install-all/some/none prompt that made onboarding pause mid-flow. Pins the
    # direct-install invariant plus the auth/bootstrap carve-outs the fix relies on.
    name: setup-skill-direct-install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: /setup installs missing tools directly (no tool-choice prompt)
        run: bash core/scripts/tests/setup-skill-direct-install.test.sh
      - name: Setup completeness checklist and SessionStart nag
        run: bash core/scripts/tests/setup-completeness-nag.test.sh

  worktree-gc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Safe worktree garbage collector. The data-safety invariants (never remove
    # a dirty, unmerged/unpushed, too-recent, or in-use worktree; default
    # dry-run) are enforced by this offline fixture test, not reviewer vigilance.
    # Policy: core/policies/hq-worktree-retention.md
    name: worktree-gc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GC removes only provably-safe stale worktrees
        run: bash core/scripts/tests/worktree-gc.test.sh

  hq-delegate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # /delegate — one-command project handoff. Every helper ships with an
    # offline regression test (stubbed hq CLI / real git fixtures). The two
    # hard rules (no secret values, no share-session URLs in any delegation
    # artifact) are enforced by these tests, not reviewer vigilance. Policy:
    # core/policies/hq-delegate-never-inlines-secrets-or-share-urls.md
    name: hq-delegate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bundle builder (schema, prefix conventions, fail-closed secret scan)
        run: bash core/scripts/tests/hq-delegate-bundle.test.sh
      - name: Recipient resolution (person/agent, tenancy-safe)
        run: bash core/scripts/tests/hq-delegate-resolve.test.sh
      - name: Vault grants (direct-only, verified read-back)
        run: bash core/scripts/tests/hq-delegate-grant.test.sh
      - name: Vault grant status handles jq CRLF output
        run: bash core/scripts/tests/hq-delegate-grant-crlf-status.test.sh
      - name: Repo/branch handover (anchored push, dirty work surfaced)
        run: bash core/scripts/tests/hq-delegate-repo.test.sh
      - name: Secrets by name only (sentinel no-value-leak)
        run: bash core/scripts/tests/hq-delegate-secrets.test.sh
      - name: Ownership transfer (board/PRD/mesh/journal, idempotent)
        run: bash core/scripts/tests/hq-delegate-transfer.test.sh
      - name: Pickup prompt + single-DM delivery (verify-gated)
        run: bash core/scripts/tests/hq-delegate-send.test.sh
      - name: Reachability probe + inert dry run
        run: bash core/scripts/tests/hq-delegate-verify.test.sh
      - name: Final dossier publication and canonical content verification
        run: bash core/scripts/tests/hq-delegate-publish.test.sh
      - name: /delegate skill structural contract
        run: bash core/scripts/tests/hq-delegate-skill.test.sh
      - name: /delegate script references resolve
        run: bash core/scripts/lint-skill-script-refs.sh delegate

  install-deps:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1727: HQ's install/setup surface must not install or dependency-check
    # a third-party CLI that HQ itself never calls. The /setup wizard used to
    # `which vercel` + offer `npm install -g vercel`, gating setup on a tool
    # /deploy never uses (it targets hq-deploy). Denylist: core/scripts/
    # install-deps.deny. Catches FUTURE re-introductions, not just vercel.
    name: install-deps
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install surface installs no user-provided deploy CLI
        run: bash core/scripts/lint-install-deps.sh
      - name: Regression test (fixture + live tree + fix present)
        run: bash core/scripts/tests/install-deps.test.sh

  hq-cowork-mcp-secret-guard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hq-cowork-mcp-secret-guard
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Run cowork plugin build prerequisite test
        run: bash core/packages/hq-pack-cowork/scripts/tests/build-plugin-prerequisites.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Install pinned MCP server dependencies
        run: pnpm --dir core/packages/hq-pack-cowork/mcp-server install --frozen-lockfile --ignore-workspace
      - name: Run hq-pack-cowork MCP server tests
        run: pnpm --dir core/packages/hq-pack-cowork/mcp-server test

  # Installer→Claude PATH gap: the template must not hardcode env.PATH, and
  # the setup.sh snapshot must include the native installer's managed
  # toolchain dirs even when the session PATH is missing them (GUI-launched
  # Claude never sources the shell-profile block that wires them in).
  # US-001: canonical YAML-backed validation for shipped skill metadata and
  # generated agents/openai.yaml contracts.
  agent-runtime-skill-metadata:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: agent-runtime-skill-metadata
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned YAML parser for skill metadata contracts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/agent-runtime-parser"
          node core/scripts/validate-agent-runtime-contracts.mjs install-parser --install-dir "$install_dir"
          echo "HQ_AGENT_RUNTIME_PARSER_ROOT=$install_dir" >> "$GITHUB_ENV"
      - name: Validate shipped skill metadata + openai.yaml
        run: node core/scripts/validate-agent-runtime-contracts.mjs
      - name: Skill metadata regression test
        run: bash core/scripts/tests/agent-runtime-skill-metadata.test.sh
      - name: Codex pack build regression test
        run: bash core/scripts/tests/build-codex-pack.test.sh
      - name: HQ Anywhere package contract regression test
        run: bash core/scripts/tests/hq-anywhere-package-contract.test.sh
      - name: Outpost host app regression test
        run: bash core/scripts/tests/outpost-host-app.test.sh
      - name: HQ Anywhere hook flag cache regression test
        run: bash core/scripts/tests/hqd-hook-flag-cache.test.sh
      - name: Claude Code plugin build regression test
        run: bash core/scripts/tests/build-claude-plugin.test.sh
      - name: Agent bootstrap cloud sync guidance regression test
        run: bash core/scripts/tests/agent-bootstrap-cloud-sync.test.sh
      - name: hq-heal sync classifier regression test
        run: bash core/scripts/tests/hq-heal-sync-classifier.test.sh
      - name: Discover shallow clone fetch refspec regression test
        run: bash core/scripts/tests/discover-shallow-clone-fetch-all.test.sh
      - name: Execute-task Codex model source regression test
        run: bash core/scripts/tests/execute-task-codex-model-source.test.sh
      - name: Worker Codex model override flag and scope regression test
        run: node core/scripts/tests/worker-codex-model-overrides.test.cjs
      - name: OpenAI YAML generator root regression test
        run: bash core/scripts/tests/generate-openai-yaml-root.test.sh
      - name: Codex skill metadata coverage regression test
        run: bash core/scripts/tests/codex-skill-metadata-coverage.test.sh
      - name: export-skill-catalog wrapper regression test
        run: bash core/scripts/tests/export-skill-catalog.test.sh
      - name: Validate concrete shipped skill command permissions
        run: node core/scripts/validate-agent-runtime-contracts.mjs validate-permissions
      - name: Skill command permission regression test
        run: bash core/scripts/tests/agent-runtime-permissions.test.sh
      - name: Install ShellCheck for cross-runtime shell contracts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck cross-runtime adapters and fixtures
        run: |
          shellcheck -S warning \
            core/scripts/hook-lib.sh \
            core/scripts/lint-shell-portability.sh \
            core/scripts/hq-job-run.sh \
            core/scripts/hq-job-notify.sh \
            core/scripts/outpost-jobs-reconcile.sh \
            core/scripts/handoff-finalize.sh \
            core/scripts/hq-job-probe.sh \
            core/scripts/tests/hq-job-run.test.sh \
            core/scripts/tests/hq-job-probe.test.sh \
            core/scripts/tests/outpost-jobs-reconcile.test.sh \
            core/scripts/tests/outpost-job-failure-alerts.test.sh \
            core/scripts/tests/handoff-finalize-pointer.test.sh \
            core/scripts/tests/agent-runtime-skill-metadata.test.sh \
            core/scripts/generate-openai-yaml.sh \
            core/scripts/tests/discover-shallow-clone-fetch-all.test.sh \
            core/scripts/tests/execute-task-codex-model-source.test.sh \
            core/scripts/tests/generate-openai-yaml-root.test.sh \
            core/scripts/tests/codex-skill-metadata-coverage.test.sh \
            core/scripts/tests/agent-runtime-permissions.test.sh \
            core/scripts/tests/us091-policy-and-skill-contract.test.sh \
            core/scripts/tests/hook-runtime-diagnostics.test.sh \
            core/scripts/tests/hook-launch-sigpipe-status.test.sh \
            core/scripts/tests/hooks-drain-stdin-before-early-exit.test.sh \
            core/scripts/tests/agent-runtime-contracts-e2e.test.sh \
            core/scripts/lib/lanes-senior-monitor.sh \
            core/scripts/tests/lanes-senior-monitor-stop-gate.test.sh \
            core/scripts/tests/handoff-post-hq-root.test.sh \
            core/scripts/tests/lib/handoff-post-test-helpers.sh \
            .claude/hooks/hook-gate.sh \
            .claude/hooks/check-claude-desktop-bridge-health.sh \
            .claude/skills/deploy/scripts/tests/guardrails-tar-failure.test.sh \
            .claude/skills/deploy/scripts/site-events.sh \
            .claude/skills/deploy/scripts/tests/site-events.test.sh \
            .codex/hooks/hq-codex-hook-adapter.sh \
            .grok/hooks/hq-grok-hook-adapter.sh
      - name: Claude Codex Grok Cowork runtime contract matrix
        run: bash core/scripts/tests/agent-runtime-contracts-e2e.test.sh

  compose-settings-path:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: compose-settings-path
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: settings.json PATH snapshot composition
        run: bash core/scripts/tests/compose-settings-path.test.sh
      - name: setup PATH stays out of locked settings.json when the hq-flags gate is enabled
        run: bash core/scripts/tests/setup-path-settings-local.test.sh

  agent-session-resume:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The resume store is what lets a user revive a Slack thread days later, and
    # its records are the only handle any sweep has on a conversation. These
    # suites existed but nothing ran them on a PR — this job is that gate.
    name: agent-session-resume
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resume store round-trip, TTL, and discard paths
        run: bash core/scripts/tests/hq-agent-session-resume.test.sh
      - name: Conversation descriptor on resume records
        run: bash core/scripts/tests/hq-agent-session-resume-descriptor.test.sh
      - name: Resume wiring through a real turn (incl. descriptor callsite)
        run: bash core/scripts/tests/hq-agent-session-resume-wiring.test.sh
      - name: Multi-line /slash never dispatches a skill
        run: bash core/scripts/tests/hq-agent-session-skill-dispatch-multiline.test.sh

  hook-health-prevention:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1942: project hook configuration can be absent or never loaded in
    # Desktop/SDK sessions. Keep the independent doctor, release-overlay
    # contract, and remediation docs from drifting together.
    name: hook-health-prevention
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for doctor-path coverage
        run: |
          set -euo pipefail
          bash core/scripts/ci/install-pinned-hq-cli.sh
          if ! command -v hq >/dev/null 2>&1; then
            echo "ERROR: hook-health prevention requires hq on PATH to exercise the doctor path." >&2
            exit 1
          fi
          HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
          hq doctor --help >/dev/null 2>&1
      - name: Hook health checker behavior
        run: bash core/scripts/tests/hook-health-check.test.sh
      - name: CLI floor reader, cache, and hook checker
        run: bash core/scripts/tests/hq-cli-floor.test.sh
      - name: Setup warns for an old or missing CLI
        run: bash core/scripts/tests/setup-hq-cli-floor.test.sh
      - name: Hook settings release contract
        run: bash core/scripts/tests/hook-settings-release-contract.test.sh
      - name: walk_up_to_hq_root and is_hq_root form no //core path
        run: bash core/scripts/tests/walk-root-no-double-slash.test.sh

  # US-015: check-client-health runs on EVERY session start, spawns detached
  # background work, and can file bug reports on the user's behalf. Pin that a
  # healthy install stays silent, a degraded one remediates exactly once per
  # cooldown, HQ_DISABLED_HOOKS opts out, the hook never exits non-zero, and its
  # doctor-JSON parsing is python-free on both engines.
  client-health-hook:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: client-health-hook
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: check-client-health behaviour (detection, cooldown, opt-out, engines)
        run: bash core/scripts/tests/check-client-health.test.sh

  # feedback_4e67345c: an unquoted project-root path in a hook command is
  # word-split by /bin/sh, so every hook dies non-blocking and silent on an
  # install path containing a space. The guard existed but ran in no workflow.
  hook-path-resolution:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hook-path-resolution
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: Hook commands resolve from an install path containing spaces
        run: bash core/scripts/tests/hook-path-resolution.test.sh
      - name: Restored hook registrations neutralize BASH_ENV
        run: bash core/scripts/tests/restore-hook-settings.test.sh
      - name: ensure-hq-cli hook detects/install/PATH-fixes the CLI
        run: bash core/scripts/tests/ensure-hq-cli-hook.test.sh
      - name: ensure-hq-desktop hook detects/updates the desktop app
        run: bash core/scripts/tests/ensure-hq-desktop-hook.test.sh

  # A hook that exits before reading stdin used to be reported as having FAILED
  # with 141: the dispatcher piped the payload in, the hook closed the read end,
  # the writer died of SIGPIPE, and `pipefail` promoted that to the pipeline
  # status. It refused an agent's first company read on a fresh session and
  # failed 2 of 3 v1->v2 fleet migration probes on hq-core 15.0.139.
  hook-launch-status:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: hook-launch-status
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: A hook's recorded status is the hook's, not its payload writer's
        run: bash core/scripts/tests/hook-launch-sigpipe-status.test.sh
      - name: Hooks that exit before reading stdin still drain it
        run: bash core/scripts/tests/hooks-drain-stdin-before-early-exit.test.sh

  # feedback_3cdd3064: deploy-summary.sh aborted under set -u when HQ_DEPLOY_API was unset.
  deploy-summary-nounset:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: deploy-summary-nounset
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: deploy-summary.sh tolerates unset HQ_DEPLOY_API under set -u
        run: bash core/scripts/tests/deploy-summary-nounset.test.sh

  # task-3517155514: /deploy must always resolve a non-empty API base (public
  # default https://api.indigo-hq.com) so a fresh install does not stall at Phase C.
  resolve-deploy-api:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: resolve-deploy-api
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: deploy API base always resolves (public-default fallback)
        run: bash core/scripts/tests/resolve-deploy-api.test.sh

  # task-2854627137: /deploy org resolution must work for AGENT callers (agt_),
  # not just humans — else an agent's company deploy silently downgrades to personal.
  resolve-deploy-org:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: resolve-deploy-org
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: deploy org resolves for agent + human callers (via /membership/me)
        run: bash core/scripts/tests/resolve-deploy-org.test.sh

  # US-001: /deploy identity-resolve portable USER key + TMPDIR lock (#357 regression).
  identity-resolve:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: identity-resolve
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: identity-resolve USER/USERNAME lock path
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh
      - name: guardrails reports and removes a failed tarball
        run: bash .claude/skills/deploy/scripts/tests/guardrails-tar-failure.test.sh
      - name: route-host merges routes onto an existing deploy
        run: bash .claude/skills/deploy/scripts/tests/route-host.test.sh
      - name: site-events owner loop (enable, list, watch, reply)
        run: bash .claude/skills/deploy/scripts/tests/site-events.test.sh

  # US-001: identity-resolve jq→node fallback; missing engines → missing_dependency not login_required.
  identity-resolve-missing-jq:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: identity-resolve-missing-jq
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: identity-resolve node fallback + missing_dependency
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh

  # US-002: shared OS portability helpers (stat/sed/tmp/user/require_jq).
  portable-lib:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: portable-lib
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: portable.sh helpers
        run: bash core/scripts/tests/portable-lib.test.sh

  # feedback_1b307a08: nested manifests were misparsed by a flat col-0 regex.
  manifest-nested-parse:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: manifest-nested-parse
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Nested company manifest parsing
        run: bash core/scripts/tests/manifest-nested-parse.test.sh

  # feedback_c930eafe: catch stale org chart drift between README teams and person ontology.
  ontology-readme-drift:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: ontology-readme-drift
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: README team table matches person ontology
        run: bash core/scripts/tests/ontology-readme-drift.test.sh

  git-pack-extension:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # A packfile set is paired BY EXTENSION (pack-<sha>.pack/.idx/.rev). Strip
    # the extension off one of them and git stops seeing the whole set: the
    # objects are intact on disk but report as missing, so the repo presents as
    # catastrophic history loss when the actual repair is a rename. Observed on
    # a macOS HQ root alongside Finder Icon\r cruft. The suite asserts against
    # real repos and real packfiles — it builds the breakage, proves git fails,
    # then proves the repair makes git healthy again.
    name: git-pack-extension
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          command -v hq
          hq core --help >/dev/null
      - name: De-extensioned packfile detection and repair
        run: bash core/scripts/tests/git-pack-extension-check.test.sh

  auto-tag-release-parse:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # US-048: auto-tag-release.yml used to read only the head subject, so a
    # merge-commit merge of `release: v<semver>` never tagged. Parse lives in
    # core/scripts/parse-release-tag.sh so squash, parent-2, and PR-title
    # paths can be regression-tested without a live push to hq-core main.
    name: auto-tag-release-parse
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Parse release tag from squash and merge-commit subjects
        run: bash core/scripts/tests/parse-release-tag.test.sh

  git-mutation-guard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # DEV-1765: the HQ-root git-mutation guard must FIRE correctly under BOTH
    # harnesses. Under Codex the adapter used to resolve HQ_ROOT from the cwd's
    # git toplevel, which collapses into a nested repo (repos/*), missed the
    # gate, and exited 0 — silently allowing `cd <hq-root> && git push` from a
    # nested cwd. Claude side: block-hq-root-git-mutation.test.sh. Codex side:
    # codex-git-mutation-firing.test.sh (real adapter + gate + hook, no stubs).
    name: git-mutation-guard
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Claude-harness git-mutation guard
        run: bash core/scripts/tests/block-hq-root-git-mutation.test.sh
      - name: US-146 positional gh repository anchors
        run: bash core/scripts/tests/us146-gh-positional-repo-anchors.test.sh
      - name: Codex-harness git-mutation guard fires
        run: bash core/scripts/tests/codex-git-mutation-firing.test.sh
      - name: Codex explicit shell paths guard
        run: bash core/scripts/tests/codex-explicit-path-guard.test.sh
      - name: Codex explicit-path flag reader
        run: node --test core/scripts/tests/codex-explicit-path-flag.test.cjs
      - name: Company repo creation and Git metadata guards
        run: bash .claude/hooks/tests/block-company-code-repos.test.sh
      - name: Repo guard common-path process budget
        run: bash core/scripts/tests/repogit-guard-spawn-budget.test.sh
      - name: Repo guard command survives master-hook parsing
        run: bash core/scripts/tests/master-hook-repogit-command-roundtrip.test.sh
      - name: Codex hook adapter routes mandatory scope authorizer
        run: bash core/scripts/test-codex-hook-adapter.sh

  # ---------------------------------------------------------------------------
  # B4 (feedback_b16e277b): the autocommit hook ended every git call with
  # `|| exit 0` and the handoff finalizer reported a refused commit inside an
  # exit-0 success payload, so a wedged .git/index.lock stopped all HQ writes
  # for hours with zero signal. Neither suite was wired into CI before.
  #
  # These five suites used to run back to back in ONE job that took 6.4 min and
  # was the single longest job in this 61-job workflow — so it alone set the
  # whole workflow's wall clock (measured 2026-08-17: 6.3 min of a 6.5 min run).
  # The breakdown was 1.9 min to install the hq CLI, 2.7 min for the qmd reindex
  # suite, and 1.7 min for the other four together.
  #
  # The qmd suite is therefore split onto its own runner so it stops queueing
  # behind the handoff suites. Both jobs keep the hq CLI install: four of the
  # five suites reference a core/scripts CLI forwarder (hq-status-summary.sh,
  # rebuild-threads-index.sh, rebuild-orchestrator-index.sh, qmd-reindex-bg.sh,
  # archive-old-threads.sh), and forwarder-ci-contract.test.sh requires every
  # job running such a suite to carry the install/validation step. Do NOT try to
  # drop the install from the handoff job on the grounds that its scripts never
  # type `hq` directly — they reach it THROUGH those forwarders, which is
  # precisely the false negative that contract exists to catch.
  #
  # `autosave-failure-visibility` below is the aggregating gate and keeps the
  # name: branch protection matches on check NAME, so the aggregator is what
  # makes splitting these legs safe to do again later.
  # ---------------------------------------------------------------------------
  autosave-failure-visibility-handoff:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: autosave-failure-visibility (handoff)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: Autocommit hook surfaces git failures and stays quiet otherwise
        run: bash core/scripts/tests/hq-autocommit.test.sh
      - name: Autocommit failure context reaches the model behind its flag
        run: HQ_AUTOCOMMIT_TEST_PATH_CASE=failure-context bash core/scripts/tests/hq-autocommit.test.sh
      - name: Autocommit commits never start automatic git maintenance
        run: HQ_AUTOCOMMIT_TEST_PATH_CASE=auto-maintenance bash core/scripts/tests/hq-autocommit.test.sh
      - name: Handoff pointer is atomic and worktree-resumable
        run: bash core/scripts/tests/handoff-finalize-pointer.test.sh
      - name: Handoff finalizer never reports a failed commit as success
        run: bash core/scripts/tests/handoff-finalize-commit-status.test.sh
      - name: Handoff finalizer smoke
        run: bash core/scripts/tests/handoff-finalize-smoke.sh
      - name: Handoff finalizer accepts a large file-backed changeset
        run: bash core/scripts/tests/handoff-finalize-large-changeset.test.sh
      - name: Handoff follow-ups stay pending without dispatch proof
        run: bash core/scripts/tests/handoff-followups-runtime.test.sh
      - name: Handoff document-release dispatch requires an installed skill
        run: bash core/scripts/tests/handoff-post-document-release-skill.test.sh
      - name: Handoff post never launches Claude CLI jobs
        run: bash core/scripts/tests/handoff-post-no-claude.test.sh
      - name: Handoff post keeps company sync and document-release scope
        run: bash core/scripts/tests/handoff-post-company-scope.test.sh
      - name: Handoff post ignores the caller's HQ_ROOT
        run: bash core/scripts/tests/handoff-post-hq-root.test.sh

  autosave-failure-visibility-qmd-reindex:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: autosave-failure-visibility (qmd-reindex)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: Handoff qmd reindex ownership (agent skip + laptop single-flight)
        run: bash core/scripts/tests/qmd-handoff-reindex.test.sh
      - name: Keep the pinned CLI opt-out in hermetic tests
        run: bash core/scripts/tests/hermetic-hq-no-update-check.test.sh

  # Aggregating gate. Green ONLY if BOTH legs above succeeded — a skipped or
  # cancelled leg reds this too, so the split cannot silently drop a suite.
  autosave-failure-visibility:
    name: autosave-failure-visibility
    needs:
      - autosave-failure-visibility-handoff
      - autosave-failure-visibility-qmd-reindex
    if: ${{ (always()) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Every autosave-failure-visibility leg passed
        run: |
          set -euo pipefail
          handoff='${{ needs.autosave-failure-visibility-handoff.result }}'
          qmd='${{ needs.autosave-failure-visibility-qmd-reindex.result }}'
          echo "handoff=$handoff qmd-reindex=$qmd"
          rc=0
          [ "$handoff" = "success" ] || rc=1
          [ "$qmd" = "success" ] || rc=1
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: an autosave-failure-visibility leg did not succeed." >&2
            exit 1
          fi

  journal-session-isolation:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: journal-session-isolation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate the pinned hq CLI for hook helpers
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          command -v hq
          hq core --help
          HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
      - name: Session-scoped journal pointers and ownership validation
        run: bash core/scripts/tests/journal-session-scoped-pointer.test.sh
      - name: Stop hook selects only its session journal
        run: bash core/scripts/tests/after-turn-suggestions.test.sh
      - name: Context checkpoint hooks
        run: bash core/scripts/tests/context-checkpoint-hooks.test.sh
      - name: Bounded transcript tails preserve hook behavior
        run: bash core/scripts/tests/enforce-humanize-before-send.test.sh
      # The Stop-gate regression controls PATH for both hq-present and missing-hq cases.
      - name: Checkpoint Stop gate
        run: bash core/scripts/tests/checkpoint-stop-gate.test.sh
      - name: Stop gate and reindex common-path spawn budgets
        run: bash core/scripts/tests/stopgate-reindex-spawn-budget.test.sh
      - name: Lane senior Monitor Stop/reminder shim wiring
        run: bash core/scripts/tests/lanes-senior-monitor-stop-gate.test.sh
      - name: Lane senior Stop-gate PATH-shim process budget
        run: bash .claude/hooks/tests/lanes-senior-monitor-stop-gate-process-budget.test.sh
      - name: Checkpoint and journal hooks do not over-trigger
        run: bash core/scripts/tests/checkpoint-journal-noise.test.sh
      - name: Session id resolves to this process, not .current
        run: bash core/scripts/tests/session-id.test.sh
      - name: Session scope capability mint/read contract
        run: bash core/scripts/tests/session-scope-capability.test.sh
      - name: Mandatory scope authorizer blocks cross-company access
        run: bash core/scripts/tests/mandatory-scope-authorizer.test.sh
      - name: Mandatory scope authorizer process budget and deny parity
        run: bash core/scripts/tests/mandatory-scope-authorizer-spawn-budget.test.sh
      - name: Directory symlink scope for Grep, Glob, and Bash
        run: bash core/scripts/tests/scope-authorizer-symlink-dirs.test.sh
      - name: Secret detector scans Write/Edit/MultiEdit/NotebookEdit content
        run: bash core/scripts/tests/detect-secrets-file-tools.test.sh
      - name: Secret detector has no command-keyword escape; token boundary holds
        run: bash core/scripts/tests/detect-secrets-escape-hardening.test.sh
      - name: Secret detector block message never echoes the matched value
        run: bash core/scripts/tests/detect-secrets-no-value-leak.test.sh
      - name: Env-dump hook blocks printenv on the live PreToolUse path (DEF-026)
        run: bash core/scripts/tests/block-env-dump.test.sh
      - name: Policy reminder stays under the host output ceiling; hard rules rank first
        run: bash core/scripts/tests/inject-policy-output-ceiling.test.sh
      - name: Policy reminder output trimming avoids per-line tail launches
        run: bash core/scripts/tests/inject-policy-output-trim-performance.test.sh
      - name: Story deliverables gate on passes:true
        run: bash core/scripts/tests/verify-story-deliverables.test.sh
      - name: Delegation pickup receipt / FAILED state
        run: bash core/scripts/tests/hq-delegate-pickup.test.sh
      - name: Handoff next-step ids and closure
        run: bash core/scripts/tests/handoff-open-steps.test.sh
      - name: Policy delivery benchmark (live + scenarios)
        run: bash core/scripts/tests/policy-benchmark.test.sh
      - name: Live runtime smoke (skips when no runtime CLI is installed on the runner)
        run: bash core/scripts/tests/harness-live-smoke.sh --runtimes claude,codex,grok
      - name: hq-session mints scope capability on company bind
        run: bash core/scripts/tests/hq-session.test.sh
      - name: Bounded-action scope contract (Claude+Codex shared text)
        run: bash core/scripts/tests/startwork-bounded-action-contract.test.sh
      - name: Company infra policy reminder follows the firing session
        run: bash core/scripts/tests/surface-company-infra-policy.test.sh

  policy-forwarders:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: policy-forwarders
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install and validate the pinned hq CLI
        run: |
          bash core/scripts/ci/install-pinned-hq-cli.sh
          npm_prefix="$(npm prefix -g)"
          export PATH="$npm_prefix/bin:$PATH"
          command -v hq
          hq core --help
      - name: Check the published CLI catalog
        run: HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
      - name: Policy age report flags retirement candidates through hq core
        run: bash core/scripts/tests/policy-age-report.test.sh
      - name: Policy retire / restore and consumers skip retired through hq core
        run: bash core/scripts/tests/policy-retire.test.sh
      - name: Policy retrieval ledger reads age report through hq core
        run: bash core/scripts/tests/record-policy-retrieval.test.sh
      - name: Policy write guard keeps sanctioned script-path compatibility
        run: bash core/scripts/tests/block-policy-writes-bash.test.sh

  mcp-cleanup-session-scope:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: mcp-cleanup-session-scope
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Stop-hook cleanup stays inside its own session tree
        run: bash core/scripts/tests/cleanup-mcp-session-scope.test.sh

  hq-agent-session-harness:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # US-411 assembly timing budget + US-412 golden-turn parity harness.
    name: hq-agent-session-harness
    runs-on: ubuntu-24.04-arm
    steps:
