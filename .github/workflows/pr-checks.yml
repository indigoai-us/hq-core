  # ---------------------------------------------------------------------------
  # B4 (feedback_b16e277b): the autocommit hook ended every git call with
  # `|| exit 0` and the handoff finalizer reported a refused commit inside an
  # exit-0 success payload, so a wedged .git/index.lock stopped all HQ writes
  # for hours with zero signal. Neither suite was wired into CI before.
  #
  # These five suites used to run back to back in ONE job that took 6.4 min and
  # was the single longest job in this 61-job workflow — so it alone set the
  # whole workflow's wall clock (measured 2026-08-17: 6.3 min of a 6.5 min run).
  # The breakdown was 1.9 min to install the hq CLI, 2.7 min for the qmd reindex
  # suite, and 1.7 min for the other four together.
  #
  # The qmd suite is therefore split onto its own runner so it stops queueing
  # behind the handoff suites. Both jobs keep the hq CLI install: four of the
  # five suites reference a core/scripts CLI forwarder (hq-status-summary.sh,
  # rebuild-threads-index.sh, rebuild-orchestrator-index.sh, qmd-reindex-bg.sh,
  # archive-old-threads.sh), and forwarder-ci-contract.test.sh requires every
  # job running such a suite to carry the install/validation step. Do NOT try to
  # drop the install from the handoff job on the grounds that its scripts never
  # type `hq` directly — they reach it THROUGH those forwarders, which is
  # precisely the false negative that contract exists to catch.
  #
  # `autosave-failure-visibility` below is the aggregating gate and keeps the
  # name: branch protection matches on check NAME, so the aggregator is what
  # makes splitting these legs safe to do again later.
  # ---------------------------------------------------------------------------
  autosave-failure-visibility-handoff:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: autosave-failure-visibility (handoff)
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: Autocommit hook surfaces git failures and stays quiet otherwise
        run: bash core/scripts/tests/hq-autocommit.test.sh
      - name: Autocommit failure context reaches the model behind its flag
        run: HQ_AUTOCOMMIT_TEST_PATH_CASE=failure-context bash core/scripts/tests/hq-autocommit.test.sh
      - name: Autocommit commits never start automatic git maintenance
        run: HQ_AUTOCOMMIT_TEST_PATH_CASE=auto-maintenance bash core/scripts/tests/hq-autocommit.test.sh
      - name: Autocommit reports pre-staged index holds without changing staged work
        run: bash core/scripts/tests/hq-autocommit-prestaged.test.sh
      - name: HQ-root git re-init and repair never record nested repos as gitlinks
        run: bash core/scripts/tests/hq-root-git-reinit.test.sh
      - name: macOS Icon (carriage return) files are removed from .git and missing objects restored only from matching files
        run: bash core/scripts/tests/git-icon-file-check.test.sh
      - name: Git hook dispatcher is shared by the commit secret scan and the fingerprint stage
        run: bash core/scripts/tests/commit-secret-scan.test.sh
      - name: Commit-msg hook stamps HQ-Fingerprint only inside HQ and fails open
        run: bash core/scripts/tests/hq-fingerprint-hook.test.sh
      - name: Git hook tests pass from an HQ root with an apostrophe, a space and a double quote
        run: bash core/scripts/tests/git-hooks-quoted-root.test.sh
      - name: Hook-bypassing HQ commits carry the HQ-Fingerprint trailer explicitly
        run: bash core/scripts/tests/fingerprint-explicit-trailer.test.sh
      - name: Handoff pointer is atomic and worktree-resumable
        run: bash core/scripts/tests/handoff-finalize-pointer.test.sh
      - name: Handoff finalizer never reports a failed commit as success
        run: bash core/scripts/tests/handoff-finalize-commit-status.test.sh
      - name: Handoff commit holds only its own paths and skips nested knowledge repos
        run: bash core/scripts/tests/handoff-finalize-commit-scope.test.sh
      - name: Handoff finalizer keeps swept-in media and oversize files out of commits
        run: bash core/scripts/tests/handoff-finalize-media-filter.test.sh
      - name: Handoff finalizer stores deficiencies and system_info
        run: bash core/scripts/tests/handoff-finalize-deficiencies.test.sh
      - name: Handoff finalizer checks jq and JSON arguments before writing anything
        run: |
          bash core/scripts/tests/handoff-finalize-no-jq.test.sh
          bash core/scripts/tests/handoff-finalize-json-args.test.sh
      - name: Handoff finalizer surfaces and classifies git add errors
        run: bash core/scripts/tests/handoff-finalize-stage-error.test.sh
      - name: Handoff finalizer waits out a held index.lock and scopes directory changesets
        run: bash core/scripts/tests/handoff-finalize-index-lock-retry.test.sh
      - name: Handoff finalizer counts alias-root company paths toward scope
        run: bash core/scripts/tests/handoff-finalize-logical-root.test.sh
      - name: Handoff scripts accept company slugs that start with a digit
