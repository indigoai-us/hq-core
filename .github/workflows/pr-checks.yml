          present=()
          for f in "${files[@]}"; do
            [ -f "$f" ] && present+=("$f")
          done
          echo "shellcheck ${#present[@]} files"
          shellcheck -S warning "${present[@]}"

  shell-smoke-windows:
    name: shell-smoke-windows
    needs: [denylist-scan]
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
          && (github.event_name == 'push'
              || needs['denylist-scan'].result != 'success'
              || needs['denylist-scan'].outputs.windows_shell_smoke == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            core/core.yaml
            core/scripts/cli-hosted.yaml
      - name: Resolve Windows hq CLI cache inputs
        id: hq_cli_cache
        shell: bash
        run: |
          version="$(bash core/scripts/ci/install-pinned-hq-cli.sh --resolve-only)"
          npm_prefix="$(npm prefix -g)"
          npm_root="$(npm root -g)"
          {
            printf 'version=%s\n' "$version"
            printf 'npm_prefix=%s\n' "$npm_prefix"
            printf 'npm_root=%s\n' "$npm_root"
          } >> "$GITHUB_OUTPUT"
      - name: Cache pinned hq CLI global install
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hq_cli_cache.outputs.npm_root }}\@indigoai-us\hq-cli
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq.cmd
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq.ps1
          key: hq-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.hq_cli_cache.outputs.version }}-${{ hashFiles('core/scripts/ci/install-pinned-hq-cli.sh') }}
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: portable-lib
        run: bash core/scripts/tests/portable-lib.test.sh
      - name: Git Bash forwarder preserves slash arguments and path arguments
        run: bash core/scripts/tests/forwarder-msys-argv.test.sh
      - name: jq wrapper Windows and POSIX output parity
        run: bash core/scripts/tests/jq-wrapper-platform-parity.test.sh
      - name: session-journal MSYS newline slug
        run: bash core/scripts/tests/session-journal-windows-slug.test.sh
      - name: session-journal CLI port behavior
        run: bash core/scripts/tests/session-journal-cli-port.test.sh
      - name: identity-resolve USER key
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh
      - name: identity-resolve missing engines
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh
      - name: exec-bit index
        run: bash core/scripts/tests/exec-bit-all-scripts.test.sh
      - name: hook-gate path augment
        run: bash core/scripts/tests/hook-gate-path-augment.test.sh
      - name: hook-gate exec-bit self-heal
        run: bash core/scripts/tests/hook-gate-exec-bit.test.sh
      - name: Hook path does not source BASH_ENV in child bash
        run: bash core/scripts/tests/hooks-bash-env-neutralize.test.sh
      - name: Registered SessionStart command bypasses BASH_ENV on Git Bash
        run: |
          set -euo pipefail
          registered="$(jq -r '.hooks.SessionStart[0].hooks[0].command' .claude/settings.json)"
          test -n "$registered"
          poison="$RUNNER_TEMP/sc-cli-br-poison-profile.sh"
          printf 'exit 87\n' > "$poison"
          payload="$(jq -nc --arg cwd "$GITHUB_WORKSPACE" '{session_id:"windows-bash-env-smoke",hook_event_name:"SessionStart",source:"startup",cwd:$cwd}')"
          printf '%s' "$payload" | env \
            BASH_ENV="$poison" \
            HQ_HOOK_TIMEOUT_SENTRY=0 \
            HQ_ROOT="$GITHUB_WORKSPACE" \
            CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE" \
            timeout 120s sh -c "$registered"
      - name: Hook timeout Sentry watchdog
        run: bash core/scripts/tests/hook-timeout-sentry.test.sh
      - name: Lane senior Stop-gate PATH-shim process budget
        run: bash .claude/hooks/tests/lanes-senior-monitor-stop-gate-process-budget.test.sh
      - name: hq monitor guard PATH-shim process budget
        run: bash .claude/hooks/tests/hq-monitor-guard-process-budget.test.sh
      - name: SessionStart monitor and updater subprocess budget
        run: bash core/scripts/tests/sessionstart-monitor-update-budget.test.sh
      - name: policy/core write guards PATH-shim process budget
        run: bash .claude/hooks/tests/block-policy-writes-bash-process-budget.test.sh
      - name: Hook timeout attribution tags and compact sequence
        run: HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/tests/hook-timeout-watchdog-attribution.test.sh
      - name: check-hq-update bounds GitHub network calls
        run: bash core/scripts/tests/check-hq-update-bounded-network.test.sh
      - name: block-core-writes-bash avoids grep/sed process fanout
        run: bash core/scripts/tests/block-core-writes-bash-fanout.test.sh
      - name: Master-hook registry dispatch preserves blocking exits
        run: bash core/scripts/tests/master-hook-registry-dispatch.test.sh
      - name: Gated hook IDs have profile coverage (US-157)
        run: bash core/scripts/tests/gated-hook-profile-coverage.test.sh
      - name: Codex hook adapter routes mandatory scope authorizer
        run: bash core/scripts/test-codex-hook-adapter.sh
      - name: install pinned YAML parser for agent runtime contracts
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/agent-runtime-parser"
          node core/scripts/validate-agent-runtime-contracts.mjs install-parser --install-dir "$install_dir"
          echo "HQ_AGENT_RUNTIME_PARSER_ROOT=$install_dir" >> "$GITHUB_ENV"
      - name: validate shipped skill metadata + openai.yaml
        run: node core/scripts/validate-agent-runtime-contracts.mjs

