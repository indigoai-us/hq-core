            echo "no core/scripts/tests/work-mesh-*.test.sh found" >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            bash "$t"
          done
      - name: Detached handoff launcher platform contract
        run: bash core/scripts/tests/handoff-launcher.test.sh
      - name: SessionStart detached register-project helper failure contract
