          bash core/scripts/tests/derive-trigger-facts-library-fail-closed.test.sh
          bash core/scripts/tests/derive-trigger-facts-synthetic.test.sh
          bash core/scripts/tests/eval-triggers-hooks.test.sh
          bash core/scripts/tests/harness-settings-dispatch.test.sh
          bash core/scripts/tests/hook-helper-simple-failures.test.sh
          bash core/scripts/tests/hq-agent-session-policy.test.sh
          bash core/scripts/tests/hq-agent-session-skill-dispatch.test.sh
          bash core/scripts/tests/inject-policy-baseline-bounds.test.sh
