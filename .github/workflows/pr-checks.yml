    - name: "[forwarder-ci-contract] reset checkout"
      if: "${{ !cancelled() }}"
      run: |
        git reset -q --hard
        git clean -qffdx
    - name: "[forwarder-ci-contract] Every forwarder-dependent test has an hq CLI job"
