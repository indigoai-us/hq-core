  resumework-timing-linux:
    name: resumework-timing-linux
    # Runs on every manual workflow_dispatch. On ready PRs it runs when hooks,
    # scripts, settings, policies, or the resumework skill change (see
    # denylist-scan). Never on the schedule.
    needs: [denylist-scan]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
          && (github.event_name == 'workflow_dispatch'
              || needs['denylist-scan'].result != 'success'
              || needs['denylist-scan'].outputs.resumework_timing == 'true') }}
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned hq CLI for resumework timing
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: derive-trigger-facts closed stdin parity
        run: node core/scripts/tests/derive-trigger-facts-closed-stdin.test.mjs
      - name: Measure resumework command set through master hook
        env:
          RESUMEWORK_TIMING_RUNS: '20'
        run: bash core/scripts/tests/resumework-timing.test.sh
      - name: Handoff listing stat and elapsed scaling benchmark
        run: bash core/scripts/tests/handoff-open-steps-stat-scaling-bench.sh

  shell-smoke-windows:
    name: shell-smoke-windows
    # GitHub-hosted Windows runs only on manual workflow_dispatch, the nightly
    # schedule and staging release tags, never on pull requests, to keep
    # Actions cost down. The path gate still applies; all three events pass an
    # empty or missing base, so it fails open.
    needs: [denylist-scan]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'indigoai-us/hq-core-staging'))
          && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
          && (needs['denylist-scan'].result != 'success'
              || needs['denylist-scan'].outputs.windows_shell_smoke == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            core/core.yaml
            core/scripts/cli-hosted.yaml
      - name: Native hook registration and rollback (US-015)
        run: bash core/scripts/tests/restore-hook-engine.test.sh
      - name: Golden dispatcher contract and synthetic corpus integrity (US-003)
        run: |
          bash core/scripts/tests/hook-contract/run-contract.sh --engine 'bash .claude/hooks/master-hook.sh'
          node --test core/scripts/hook-corpus/corpus.test.mjs
      - name: Install pinned mikefarah/yq for jobs-validate parity
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          github_path="$(cygpath -u "$GITHUB_PATH")"
          mkdir -p "$runner_temp/bin"
          curl --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_windows_amd64.exe" \
            --output "$runner_temp/bin/yq.exe"
          printf '%s\n' "$(cygpath -w "$runner_temp/bin")" >>"$github_path"
          "$runner_temp/bin/yq.exe" --version
      - name: Resolve Windows hq CLI cache inputs
        id: hq_cli_cache
        shell: bash
        run: |
          version="$(bash core/scripts/ci/install-pinned-hq-cli.sh --resolve-only)"
          npm_prefix="$(npm prefix -g)"
          npm_root="$(npm root -g)"
          {
            printf 'version=%s\n' "$version"
            printf 'npm_prefix=%s\n' "$npm_prefix"
            printf 'npm_root=%s\n' "$npm_root"
          } >> "$GITHUB_OUTPUT"
      - name: Cache pinned hq CLI global install
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hq_cli_cache.outputs.npm_root }}\@indigoai-us\hq-cli
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq.cmd
            ${{ steps.hq_cli_cache.outputs.npm_prefix }}\hq.ps1
          key: hq-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.hq_cli_cache.outputs.version }}-${{ hashFiles('core/scripts/ci/install-pinned-hq-cli.sh') }}
      - name: Install pinned hq CLI for forwarded scaffold scripts
        run: bash core/scripts/ci/install-pinned-hq-cli.sh
      - name: Git Bash session-title slash command argv
        run: bash core/scripts/tests/session-title-windows-argv.test.sh
      - name: Pipeline Windows path and lock identity
        run: bash core/scripts/tests/pipeline-windows-path-lock.test.sh
      - name: Session journal cross-PID lock diagnostic and regression test
        run: bash core/scripts/tests/checkpoint-journal-noise.test.sh
      - name: Policy hook resolves the npm hq shim without starting node (US-001)
        run: bash .claude/hooks/tests/inject-policy-fact-helper-windows-shim.test.sh
      - name: Master hook checks the hqd daemon socket path (US-001)
        run: bash core/scripts/tests/master-hook-hqd-socket-path.test.sh
      - name: Verify Windows hook benchmark workflow wiring
        run: bash core/scripts/tests/windows-hook-benchmark-workflow.test.sh
      - name: Measure hook benchmark on Git Bash
        shell: bash
        run: |
          set -euo pipefail
          bench_dir="$RUNNER_TEMP/hook-benchmark"
          mkdir -p "$bench_dir"
          bash core/scripts/bench-hooks.sh --tool Bash --runs 3 --json "$bench_dir/per-registration.json"
          bash core/scripts/bench-hook-corpus.sh run --corpus core/scripts/bench-hook-corpus-default.json --out "$bench_dir/default-corpus.json"
          node - "$bench_dir/default-corpus.json" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const calls = report.items
            .filter(item => item.event === 'PostToolUse')
            .map(item => item.secs * 1000)
            .sort((a, b) => a - b);
          if (calls.length === 0) throw new Error('benchmark report contains no Bash tool calls');
          const percentile = p => calls[Math.ceil(p * calls.length) - 1];
          console.log(`Bash tool call latency: n=${calls.length} p50_ms=${percentile(0.50).toFixed(1)} p95_ms=${percentile(0.95).toFixed(1)}`);
          NODE
      - name: Upload raw Windows hook benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-hook-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/hook-benchmark/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Measure resumework command set through master hook
        env:
          RESUMEWORK_TIMING_RUNS: '20'
          RESUMEWORK_HOOK_BUDGET_MS: '70000'
        run: bash core/scripts/tests/resumework-timing.test.sh
      - name: Handoff listing stat and elapsed scaling benchmark
        run: bash core/scripts/tests/handoff-open-steps-stat-scaling-bench.sh
      - name: portable-lib
        run: bash core/scripts/tests/portable-lib.test.sh
      - name: Git Bash forwarder preserves slash arguments and path arguments
        run: bash core/scripts/tests/forwarder-msys-argv.test.sh
      - name: qmd reindex forwarder converts paths only on a Windows Bash
        run: bash core/scripts/tests/qmd-reindex-bg-cygpath-gate.test.sh
      - name: jq wrapper Windows and POSIX output parity
        run: bash core/scripts/tests/jq-wrapper-platform-parity.test.sh
      - name: jq wrapper probes --binary once per script run
        run: bash core/scripts/tests/jq-binary-probe-once.test.sh
      - name: session-journal MSYS newline slug
        run: bash core/scripts/tests/session-journal-windows-slug.test.sh
      - name: session-journal CLI port behavior
        run: bash core/scripts/tests/session-journal-cli-port.test.sh
      - name: derive-trigger-facts closed stdin returns promptly
        run: node core/scripts/tests/derive-trigger-facts-closed-stdin.test.mjs
      - name: identity-resolve USER key
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve.test.sh
      - name: identity-resolve missing engines
        run: bash .claude/skills/deploy/scripts/tests/identity-resolve-missing-jq.test.sh
      - name: exec-bit index
        run: bash core/scripts/tests/exec-bit-all-scripts.test.sh
      - name: hook-gate path augment
        run: bash core/scripts/tests/hook-gate-path-augment.test.sh
      - name: hook-gate exec-bit self-heal
        run: bash core/scripts/tests/hook-gate-exec-bit.test.sh
      - name: Welcome brief SessionStart hook
        run: bash core/scripts/tests/welcome-brief-ready.test.sh
      - name: Hook path does not source BASH_ENV in child bash
        run: bash core/scripts/tests/hooks-bash-env-neutralize.test.sh
      - name: Registered SessionStart command bypasses BASH_ENV on Git Bash
        run: |
          set -euo pipefail
          registered="$(jq -r '.hooks.SessionStart[0].hooks[0].command' .claude/settings.json)"
          test -n "$registered"
