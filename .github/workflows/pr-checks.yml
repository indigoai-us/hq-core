  # Grouped Linux checks (2 former jobs, ~1.4 min).
  # Each step is prefixed with its former job name; a failure skips the
  # rest of that job's steps only, and the last step lists results per job.
  linux-checks-5:
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    name: linux-checks-5
    runs-on: ${{ github.repository == 'indigoai-us/hq-core-staging' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HQ_STAGING_RUNNER_LINUX_ARM || '"ubuntu-24.04-arm"') || 'ubuntu-24.04-arm' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: "[cli-hosted-forwarders] Install pinned hq CLI for forwarded scaffold scripts"
      id: t_cli_hosted_forwarders__1
      if: "${{ !cancelled() }}"
      run: bash core/scripts/ci/install-pinned-hq-cli.sh
    - name: "[cli-hosted-forwarders] CLI-hosted manifest and backmerge guard"
      id: t_cli_hosted_forwarders__2
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__1.outcome == 'success' }}"
      run: bash core/scripts/check-cli-hosted.sh
    - name: "[cli-hosted-forwarders] CLI-hosted generator, floor and guard contract"
      id: t_cli_hosted_forwarders__3
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__2.outcome == 'success' }}"
      run: bash core/scripts/tests/cli-hosted-manifest.test.sh
    - name: "[cli-hosted-forwarders] DM bind length guard with the pinned CLI"
      id: t_cli_hosted_forwarders__4
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__3.outcome == 'success' }}"
      env:
        HQ_CLI_REQUIRED_IN_CI: 1
      run: bash core/scripts/tests/hq-dm-bind-length-guard.test.sh
    - name: "[cli-hosted-forwarders] DM bind mentions with the pinned CLI"
      id: t_cli_hosted_forwarders__5
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__4.outcome == 'success' }}"
      env:
        HQ_CLI_REQUIRED_IN_CI: 1
      run: bash core/scripts/tests/hq-dm-bind-mentions.test.sh
    - name: "[cli-hosted-forwarders] DM bind machine principal with the pinned CLI"
      id: t_cli_hosted_forwarders__6
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__5.outcome == 'success' }}"
      env:
        HQ_CLI_REQUIRED_IN_CI: 1
      run: bash core/scripts/tests/hq-dm-bind-machine-principal.test.sh
    - name: "[cli-hosted-forwarders] Batched policy frontmatter forwarding and skill callsites"
      id: t_cli_hosted_forwarders__7
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__6.outcome == 'success' }}"
      env:
        HQ_TEST_REQUIRE_REAL_CLI: 1
        HQ_TEST_REAL_CLI: hq
      run: bash core/scripts/tests/read-policy-frontmatter-batch.test.sh
    - name: "[cli-hosted-forwarders] Pinned CLI install and command-catalog parity controls"
      id: t_cli_hosted_forwarders__8
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__7.outcome == 'success' }}"
      run: bash core/scripts/tests/cli-hosted-pinned-cli.test.sh
    - name: "[cli-hosted-forwarders] Current published CLI catalog parity"
      id: t_cli_hosted_forwarders__9
      if: "${{ !cancelled() && steps.t_cli_hosted_forwarders__8.outcome == 'success' }}"
      run: |
        set -euo pipefail
        pinned_hq="$(command -v hq)"
        pinned_version="$("$pinned_hq" --version)"
        current_prefix="$RUNNER_TEMP/hq-cli-current"
        npm_config_prefix="$current_prefix" bash core/scripts/ci/install-pinned-hq-cli.sh --version latest
        export PATH="$current_prefix/bin:$PATH"
        current_version="$(hq --version)"
        printf 'pinned hq-cli: %s\ncurrent published hq-cli: %s\n' "$pinned_version" "$current_version"
        HQ_CLI_REQUIRED_IN_CI=1 bash core/scripts/check-cli-hosted.sh
    - name: "[daily-brief-tests] reset checkout"
      if: "${{ !cancelled() }}"
      run: |
        git reset -q --hard
        git clean -qffdx
    - name: "[daily-brief-tests] Daily brief unit tests"
      id: t_daily_brief_tests__1
      if: "${{ !cancelled() }}"
      run: |
        set -euo pipefail
        brief_test_home="$(mktemp -d)"
        for suite in test_brief_helpers test_brief_additions test_local_sessions test_person_brief; do
          env HOME="$brief_test_home" XDG_CONFIG_HOME="$brief_test_home" XDG_CACHE_HOME="$brief_test_home" CLAUDE_CONFIG_DIR="$brief_test_home" CODEX_HOME="$brief_test_home" python3 -I ".claude/skills/daily-brief/scripts/$suite.py"
        done
    - name: Per-check results
      if: "${{ always() }}"
      env:
        STEPS_JSON: "${{ toJSON(steps) }}"
      run: bash core/scripts/ci/grouped-check-summary.sh
