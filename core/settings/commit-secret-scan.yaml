# HQ commit secret scanning — shipped defaults
#
# When this is on, every `git commit` on this computer is checked for secrets
# (API keys, tokens, private keys) before it is saved, and a commit that
# contains one is stopped. The check is `hq scan secrets`, which runs offline
# with no account or quota. It covers repos that use the global git hook (the
# usual case), husky repos, and repos under HQ's repos/ folder that set their
# own hook folder. Their own hooks still run after the scan. A repo outside
# repos/ with its own hook folder is not covered.
#
# It is off by default because turning it on changes your machine-wide git
# setup. HQ recommends turning it on; /hq-checkup will remind you while it is
# off.
#
# Turn it on or off with the script, not by editing this file:
#   bash core/scripts/commit-secret-scan.sh enable
#   bash core/scripts/commit-secret-scan.sh disable
#   bash core/scripts/commit-secret-scan.sh status
#
# The script records your choice in personal/settings/commit-secret-scan.yaml.
# Do not edit this file — it is release-owned and replaced by /update-hq.
#
# Resolution, first match wins:
#   1. personal/settings/commit-secret-scan.yaml
#   2. this file
#
# enabled:
#   false  (default) commits are not scanned by HQ.
#   true   commits are scanned. Set by `commit-secret-scan.sh enable`.
#
# recommend:
#   true   (default) /hq-checkup suggests turning it on while it is off.
#   false  stop suggesting it.

enabled: false
recommend: true
