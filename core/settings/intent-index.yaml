# HQ intent index. Generated by core/scripts/build-intent-index.sh; do not edit.
# One line per capability. Route plain-language asks here before reading any skill body.
version: 1
scope: shipped
builtins:
  - name: "search"
    use: "Find anything already in HQ: qmd query (hybrid), qmd search (keyword), qmd vsearch (semantic), scoped with -c <collection>."
    keywords: "find, search, where, what happened, history, remember, lookup, policy, project, knowledge, notes, sources, source, transcript, meeting, meetings"
  - name: "web"
    use: "Facts outside HQ: WebSearch and WebFetch, or the built-in browser for pages that need a real session."
    keywords: "web, online, internet, x, twitter, tweet, tweets, posts, linkedin, reddit, news, article, url, link, links, website, google, competitor"
  - name: "integrations"
    use: "Read, search, create, or update in a connected app (Slack, Linear, Notion, GitHub, Gmail, Drive, HubSpot and more) through the HQ gateway: hq integrations list --company <slug>, then the flag it prints. Never a separate MCP when HQ has the app."
    keywords: "slack, linear, notion, jira, github, sentry, gmail, email, drive, asana, clickup, figma, hubspot, salesforce, calendar, ticket, tickets, issue, issues, channel, connector, integration, integrations"
  - name: "secrets"
    use: "Use a credential without seeing it: hq run, hq secrets exec, /hq-secrets. Never paste a secret."
    keywords: "secret, secrets, credential, credentials, token, api key, password, env, key"
  - name: "files"
    use: "Vault files and sharing: /hq-files, /hq-share <path>, hq files acl."
    keywords: "file, files, vault, share, upload, download, acl, folder"
  - name: "messages"
    use: "Direct messages, channel history, reminders to teammates: /dm, hq dm."
    keywords: "dm, message, messages, remind, reminder, tell, ping, inbox, teammate"
  - name: "board"
    use: "Project board and story state: the work mesh cache under ~/.hq/work-mesh/cache/projects/, hq mesh story --story <id> --status <status>; never local prd.json status."
    keywords: "board, story, stories, backlog, queued, in progress, blocked, sprint, status of the project, what is left"
  - name: "workers"
    use: "Who does specialised work: the company's workers in the startwork capability block or core/workers/registry.yaml, run with /run <worker> <skill> or /execute-task."
    keywords: "worker, workers, who can, pipeline, run a worker, specialist, agent for"
skills:
  - name: "/accept"
    use: "Accept HQ membership invites from a magic link or raw token."
  - name: "/adr"
    use: "Capture qualifying architecture decisions as ADRs in the right HQ or repo location."
  - name: "/architect"
    use: "Find shallow modules and propose deepening refactors, ranked with file refs; never edits code. Use when code is hard to change or planning a refactor."
  - name: "/ascii-graphic"
    use: "Generate dark ASCII banner graphics for HQ and social launch assets."
  - name: "/brainstorm"
    use: "Compare approaches, surface unknowns, and draft a recommendation before PRD work."
  - name: "/calibration-report"
    use: "Summarize estimate accuracy from the assistant time log."
  - name: "/checkpoint"
    use: "Save a lightweight session checkpoint."
  - name: "/clean-worktree"
    use: "Merge an HQ worktree branch back into local main, then remove the worktree and branch. Local only; never pushes."
  - name: "/cleanup"
    use: "Audit and clean HQ structures, indexes, and stale content."
  - name: "/codebase-design"
    use: "Vocabulary for designing deep modules and clean interfaces. Triggers: \"deep module\", \"interface design\", \"design it twice\"."
  - name: "/commit-main"
    use: "Commit every dirty file in the current repo, only when on main."
  - name: "/conduct"
    use: "Orchestrator mode: route every task to a pooled HQ worker lane on Codex, Grok, or Claude so this session stays free. Triggers: \"/conduct\", \"run everything in th"
    args: "[engine] [task description] | status | off"
  - name: "/convert-codex"
    use: "Add Codex support to older Claude-first HQ roots without breaking Claude setup."
  - name: "/create-skill"
    use: "Create a shared company skill in HQ with a durable identity and ACL governance. Not for personal or local-only skills."
  - name: "/decision-queue"
    use: "Resolve pending user decisions one at a time."
  - name: "/deep-plan"
    use: "Deep planning: research subagents plus a 15-question interview for large or strategic PRDs. For light planning use /prd."
  - name: "/delegate"
    use: "Hand a project to a person or fleet agent: grants, dossier, ownership transfer, and a pickup DM."
  - name: "/deploy"
    use: "Deploy or share generated HQ artifacts through hq-deploy."
  - name: "/designate-team"
    use: "Mark a company as HQ Pro cloud-backed and sync its team setup."
  - name: "/diagnose"
    use: "Diagnosis loop for bugs you cannot reliably reproduce or measure, including perf regressions and flakes. For reproducible bugs use /investigate."
  - name: "/discover"
    use: "Pull a repo into HQ and turn parallel exploration into company knowledge and policies. Triggers: \"discover this repo\", \"ingest <repo>\"."
  - name: "/dm-bind"
    use: "Bind this session to one HQ DM channel — post structured status updates there and listen for replies (feedback, requests) that steer the work."
  - name: "/dm"
    use: "Send or read HQ Sync direct messages — inbox, 1:1 threads, channel history; also prompts, details, or scheduled notes to teammates."
  - name: "/document-release"
    use: "Update in-repo docs (README, CLAUDE.md, architecture, INDEX) to match what shipped. Use after a merge, project, or release."
  - name: "/domain-modeling"
    use: "Sharpen a project's domain terms and maintain GLOSSARY.md as its glossary. Triggers: \"what should we call this\", \"domain model\"."
  - name: "/execute-task"
    use: "Execute one PRD story through coordinated worker phases with test, lint, and typecheck gates."
  - name: "/finish-estimate"
    use: "Mark a pending time estimate complete with actual duration."
  - name: "/garden"
    use: "Audit HQ content for stale, duplicate, or inaccurate information."
  - name: "/goals"
    use: "View and manage company OKRs and key results."
  - name: "/grill-me"
    use: "Interview the user about any topic one question at a time, using the grilling engine with a question set generated from the prompt. Use for \"grill me on X\" outs"
    args: "<topic> [--rounds]"
  - name: "/grilling"
    use: "Shared interview engine for /brainstorm, /prd, and grill-me. Asks only the open frontier of a question set, looks up facts instead of asking them, and returns a"
  - name: "/handoff"
    use: "Preserve session state for a follow-up agent with handoff files and commits."
  - name: "/harness-audit"
    use: "Score an HQ setup across hooks, context, gates, persistence, search, security, and cost."
  - name: "/hq-access"
    use: "Diagnose and fix a vault file you cannot find or open — never existed, not synced (fetch and pin it), or no access (ask the owner with a one-click grant DM)."
  - name: "/hq-bug"
    use: "Submit HQ bug reports or feature requests with session context."
  - name: "/hq-checkup"
    use: "Check HQ health and fix what is safe: start the app, back up unsaved work, re-enable safety checks. Reports the rest in plain language."
  - name: "/hq-files"
    use: "Inspect or change HQ vault ACLs, grants, and shared prefixes."
  - name: "/hq-heal"
    use: "Triage and repair HQ session errors such as hook crashes, sync conflicts, or MCP failures."
  - name: "/hq-integrations"
    use: "Use the company's connected external apps (Linear, Notion, Jira, GitHub, Slack, Sentry, Gmail, Google Drive, Asana, ClickUp, Figma, HubSpot, Salesforce, and any"
  - name: "/hq-login"
    use: "Sign into HQ Cognito, preferring status, refresh, then browser login."
  - name: "/hq-logout"
    use: "Sign out of HQ Cognito and clear local tokens."
  - name: "/hq-secrets"
    use: "Use HQ CLI secrets safely through env injection or one-off exec."
  - name: "/hq-share"
    use: "Share HQ vault paths through single-use links or direct ACL grants."
  - name: "/hq-sync"
    use: "Run a full bidirectional sync for cloud-backed HQ companies."
  - name: "/hq-whoami"
    use: "Show current HQ Cognito identity and session expiry."
  - name: "/humanize"
    use: "Revise human-facing prose to remove AI tells and match the intended voice."
  - name: "/idea"
    use: "Capture a lightweight project idea on the board."
  - name: "/import-claude"
    use: "Deprecated alias for /import-context — bootstrap HQ from your prior AI footprint (Claude Code, Codex, Grok, claude.ai history plus on-disk artifacts)."
  - name: "/import-context"
    use: "Bootstrap HQ from prior Claude Code, Codex, Grok, and claude.ai history and on-disk artifacts, with guided import."
  - name: "/investigate"
    use: "Root-cause debugging before any fix: scope lock, hypothesis testing, debug report. Triggers: \"debug this\", \"why is this broken\"."
  - name: "/job"
    use: "Deprecated alias for /schedule — Outpost recurring agent jobs. Prefer /schedule."
  - name: "/journal"
    use: "Write structured session journal entries for durable working memory."
  - name: "/knowledge-pulse"
    use: "Run a lightweight freshness pass over company knowledge and policies."
  - name: "/land-batch"
    use: "Triage, review, and merge several open PRs in order, with CI and deploy checks. Triggers: \"land all PRs\", \"merge open PRs\"."
  - name: "/land"
    use: "Land a PR: watch CI, resolve review issues, merge, verify production. Triggers: \"land this\", \"merge and monitor\"."
  - name: "/learn"
    use: "Turn reusable findings into scoped policies or insight files."
  - name: "/meeting-notes"
    use: "Read HQ-native meeting notes, transcripts, recaps, and sources for a company."
  - name: "/new-agent"
    use: "Provision or repair a hosted HQ agent end to end, from identity to a verified capability probe. Routes local and external bots to their own flows."
  - name: "/new-hire"
    use: "Onboard a teammate end to end: invite, role, groups, secrets, file access, and onboarding packet. Also brings existing access up to role."
  - name: "/newcompany"
    use: "Scaffold a new HQ company, optionally through to operational: knowledge, workers, brand, integrations, access rules, and invites."
  - name: "/newworker"
    use: "Scaffold a new HQ worker with skills, tools, and knowledge."
  - name: "/onboard"
    use: "Create or join an HQ company through onboarding."
  - name: "/ontology"
    use: "Read a company ontology brief, entity graph, and freshness signals for context."
  - name: "/orchestrate"
    use: "Take an idea to a finished deliverable: brainstorm, PRD, then execute every story. --gated pauses at decisions; --plan-only stops at the PRD."
    args: "[company] <idea description> [--board <id>] [--engine codex|grok|claude] [--gated] [--plan-only]"
  - name: "/out-of-scope"
    use: "Record rejected ideas so future planning does not revisit them."
  - name: "/outpost-host"
    use: "Host an app on this HQ Outpost/EC2 VM behind nginx and return its public URL. Refuses to run elsewhere. For artifacts use /deploy."
  - name: "/personal-interview"
    use: "Build the owner profile and social voice through interview."
  - name: "/pin"
    use: "Anchor this session to one goal — the message, target, or outcome it keeps working toward across loops, wakeups, compactions, and hand-offs — and check prog"
  - name: "/plan"
    use: "Deprecated: forwards to /prd. Use /prd to create a PRD. This stub is removed in hq-core 16.0.0."
  - name: "/prd"
    use: "Create an execution-ready PRD (prd.json + README.md) with a light interview. For deep research use /deep-plan."
  - name: "/project-summary"
    use: "Render a branded visual artifact from a project's prd.json (plan summary) or brainstorm.md (research deck) and deploy it gated, returning a link."
  - name: "/promote"
    use: "Change an HQ company member role or guest path scope."
  - name: "/publish-docs"
    use: "Sync the company's published docs site to match what shipped. For in-repo docs use /document-release."
  - name: "/quality-gate"
    use: "Universal pre-commit quality checks (typecheck, lint, test, coverage, dead code) with auto-detection and --fix support"
  - name: "/recover-session"
    use: "Recover sessions that hit context limits without a handoff."
  - name: "/registry"
    use: "Inspect or update a company resource registry around resource changes."
  - name: "/resolve-conflicts"
    use: "Resolve HQ Sync conflicts by choosing local, cloud, or discard."
  - name: "/resumework"
    use: "Resume a specific handoff thread by id. For the latest handoff use /startwork."
  - name: "/retro"
    use: "Run a project or session retrospective and capture reusable lessons."
  - name: "/review-plan"
    use: "Stress-test a plan or PRD in expansion, hold, or reduction mode."
  - name: "/review"
    use: "Pre-landing code review of the git diff; critical issues block the PR. Use before a PR or when asked to review changes."
  - name: "/run-pipeline"
    use: "Multi-project pipeline orchestrator — triage, execute, PR, review, deploy with safety gates"
  - name: "/run-project"
    use: "Execute a project's PRD stories as pooled background worker lanes (never more than CONDUCT_POOL_CAP, default 8) that survive compaction. Interactive mode runs i"
    args: "{project} [--status] [--resume] [--dry-run] [--inline] [--interactive] [--ralph-mode] [--pipeline] [--in-place] [--timeout N]"
  - name: "/run"
    use: "Run or list HQ workers, preferring isolated Codex subagents when available."
  - name: "/schedule"
    use: "Schedule recurring Claude/Codex agent jobs on the user's Outpost — structured checklist requirements, dm alert profile, status-aware list from hq-pro. Alias: "
  - name: "/search"
    use: "Search HQ content and indexed repos with qmd, falling back to grep."
  - name: "/setup"
    use: "Run the HQ Starter Kit setup wizard."
  - name: "/ship"
    use: "Take PRs through review, merge, deploy, smoke test, and monitoring until every KPI is healthy. Triggers: \"ship this\", \"take this to prod\"."
  - name: "/signals"
    use: "Read HQ-native company signals such as decisions, actions, risks, commitments, and wins."
  - name: "/startwork"
    use: "Resolve current HQ context and surface useful next work options."
  - name: "/storyboard"
    use: "Lock visual design before building — explore mockups on your preferred surface (Paper, HTML, Figma) and feed discovered changes back into the PRD."
    args: "[company] {project} [--surface paper|html|figma] [--design-led]"
  - name: "/strategize"
    use: "Prioritize what to work on next, optionally with deep review."
  - name: "/sync-registry"
    use: "Rebuild a company resource registry index."
  - name: "/tdd"
    use: "Enforce test-driven development with RED→GREEN→REFACTOR cycle and coverage validation"
  - name: "/team-access"
    use: "Set, change, or repair members' default read/write access to company vault folders, and find rules that lock members out."
  - name: "/to-tickets"
    use: "Break a plan or PRD into vertical-slice tickets with dependency order. Triggers: \"break into tickets\", \"vertical slices\"."
  - name: "/track-estimate"
    use: "Manually log a time estimate."
  - name: "/tutorial"
    use: "Run hands-on HQ workflow lessons."
  - name: "/update-hq"
    use: "Upgrade HQ from the latest hq-core release."
  - name: "/wayfinder"
    use: "Plan work too big and foggy for one session as a map of investigation tickets resolved one per session."
  - name: "/work-broadcast"
    use: "Draft Slack broadcasts for completed or proposed HQ work."
  - name: "/worktree"
    use: "Create a git worktree under workspace/worktrees/ off the latest origin default branch and route all work through it."
