      process startup is immaterial, so hosting it in the CLI costs nothing and
      keeps the scaffold to configuration rather than code.
  - path: core/scripts/generate-workers-registry.sh
    command: generate-workers-registry
    kind: generated
    root: live
    interpreter: bash
    min_cli: 5.78.0
    state: forwarded
    note: |
      Why the implementation moved: it is a derived-index generator invoked explicitly and by reindex, so
      process startup is immaterial and the CLI already owns the index primitives.

      Equivalence is not assumed. The CLI's native implementation is pinned against a
      byte-frozen copy of this script's pre-migration source by a differential suite
      (hq-cli e2e/registry-scan-differential.test.ts), which compares exit status,
      stdout, stderr and a sha256 manifest of every file touched, across repeated runs.
