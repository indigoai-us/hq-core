# CLI-hosted scaffold entrypoints. This is a restricted YAML 1.2 subset:
# `entries` is a sequence of flat mappings; `note` is a literal text block.
# The Bash 3.2 + awk parser in lib/cli-hosted-manifest.awk reads these fields.
# Keep values unquoted, one field per line, and do not add YAML aliases/nesting.
entries:
  - path: .claude/hooks/block-foreground-timeout-over-harness-ceiling.sh
    command: timeout-guard
    kind: hybrid
    root: cwd
    interpreter: bash
    min_cli: 5.99.1
    state: forwarded
    note: |
      The hook forwards its payload to the CLI command and fails open when hq is missing.
  - path: .claude/hooks/checkpoint-stop-gate.sh
    command: checkpoint-stop-gate
    kind: hybrid
    root: live
    interpreter: bash
    min_cli: 5.99.0
    state: forwarded
    note: |
      The hook probes CLI capabilities and falls back to the in-tree implementation.
  - path: .claude/hooks/hook-timeout-watchdog.sh
    command: sentry report
    kind: hybrid
    root: live
    interpreter: bash
    min_cli: 5.112.0
    state: forwarded
    note: |
      The hook invokes sentry report without --hq-root, so hq-cli resolves the live root;
      hq core commands --json reports root: live for the command.
  - path: core/scripts/archive-old-threads.sh
    command: archive-old-threads
    kind: generated
    root: live
    interpreter: bash
    min_cli: 5.78.0
    state: forwarded
    note: |
      Why the implementation moved: it is a cold, explicitly-invoked operation where
      process startup is immaterial, so hosting it in the CLI costs nothing and
      keeps the scaffold to configuration rather than code.
