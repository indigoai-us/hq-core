# CLI-hosted scaffold entrypoints. This is a restricted YAML 1.2 subset:
# `entries` is a sequence of flat mappings; `note` is a literal text block.
# The Bash 3.2 + awk parser in lib/cli-hosted-manifest.awk reads these fields.
# root: live-project preserves HQ_ROOT, CLAUDE_PROJECT_DIR, then script-tree precedence.
# Keep values unquoted, one field per line, and do not add YAML aliases/nesting.
entries:
  - path: core/scripts/derive-trigger-facts.sh
    command: derive-trigger-facts
    kind: generated
    root: live
    interpreter: bash
    min_cli: 5.342.5
    state: forwarded
    note: |
      This hook-time helper runs on the hq core fast path and retains its
      bundled shell fallback while the core-native-hook-helpers flag is off.
  - path: core/scripts/eval-trigger.sh
