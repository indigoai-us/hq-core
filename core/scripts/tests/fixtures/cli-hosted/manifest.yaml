# Synthetic fixtures for the CLI-hosted forwarder generator.
entries:
  - path: core/scripts/fixture-live.sh
    command: fixture-live
    kind: generated
    root: live
    interpreter: bash
    min_cli: 5.11.0
    state: forwarded
    note: |
      Why the fixture moved: it tests live-root forwarding.
  - path: core/scripts/fixture-cwd.sh
