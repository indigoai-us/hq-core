id: bad-requirements-key
name: Unknown requirements key
schedule: "0 9 * * *"
timezone: UTC
runtime: claude
exec:
  prompt: Has an illegal requirements key.
timeout_seconds: 600
notify: dm
enabled: true
owner: user@example.com
created_at: "2026-08-23T14:00:00Z"
requirements:
  runtime: claude
  secrets:
    - SENTRY_API_TOKEN
  mcp_servers:
    - imaginary
