# HQ function manifest: one entry per hq command, daemon function, hook and
# core script, each with exactly one owner.
#
# This file is YAML. Every entry is one line holding a flow mapping written as
# JSON, so a line-based reader can use it without a YAML parser. Keep one entry
# per line, keep the keys in the order below and keep the list sorted by kind,
# then id.
#
#   id            command: the command path as typed, without `hq` and without
#                 arguments. daemon: the function name. hook, script: the path
#                 of the file from the HQ root.
#   kind          command | daemon | hook | script
#   owner         the one implementation: a source path, or `hq <command>` for
#                 a script that only forwards to that command. Never a list.
#   runtimes      hosts the function runs on: all, or any of claude, codex,
#                 grok, cursor, fleet, windows.
#   hot_path      tool-call (runs on a tool call), turn (on a prompt or at the
#                 end of a turn), session (at session start or end),
#                 hook-helper (called from a hook), background (daemon), cold
#                 (run on demand).
#   state         live | trial | retiring | removed
#   replaced_by   required when state is retiring or removed: what to use
#                 instead, in plain words.
#   released_sha256  removed files only: sha256 of each released copy.
#                 core/scripts/remove-retired-core-hooks.sh deletes a file left
#                 on an install only when its content matches one of these.
#   allowed_refs  optional: files that may still name a retiring or removed
#                 function because they handle its retirement.
#
# A retiring function may still be on disk and must have no caller. A removed
# file must not be on disk.
schema: 1
