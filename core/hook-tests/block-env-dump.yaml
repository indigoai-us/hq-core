# Fixture for block-env-dump.sh — blocks Bash commands that dump process env.
# See core/hook-tests/README.md for the schema.
hookId: block-env-dump
schemaVersion: 1
cases:
  - name: blocks-bare-printenv
    event: PreToolUse
    tool: Bash
    input:
      command: "printenv"
    expect: block

  - name: blocks-bare-env
    event: PreToolUse
    tool: Bash
    input:
      command: "env"
    expect: block

  - name: blocks-env-piped-to-grep
    event: PreToolUse
    tool: Bash
    input:
      command: "env | grep -c ."
    expect: block

  - name: blocks-env-redirected-to-file
    event: PreToolUse
    tool: Bash
    input:
      command: "env > /tmp/dump.txt"
    expect: block

  - name: blocks-printenv-teed-to-file
    event: PreToolUse
    tool: Bash
    input:
      command: "printenv | tee /tmp/dump.txt"
    expect: block

  - name: blocks-env-in-command-substitution
    event: PreToolUse
    tool: Bash
    input:
      command: "x=$(env); echo done"
    expect: block

  - name: allows-prose-paren-after-env-word
    event: PreToolUse
    tool: Bash
    input:
      command: "git commit -m 'switch to (dev env)'"
    expect: allow

  - name: allows-printenv-named-var-redirected
    event: PreToolUse
    tool: Bash
    input:
      command: "printenv HOME > /tmp/home.txt"
    expect: allow

  - name: allows-printenv-named-var
    event: PreToolUse
    tool: Bash
    input:
      command: "printenv HOME"
    expect: allow

  - name: allows-env-assignment-form
    event: PreToolUse
    tool: Bash
    input:
      command: "env FOO=bar ls"
    expect: allow

  - name: allows-benign-ls
    event: PreToolUse
    tool: Bash
    input:
      command: "ls"
    expect: allow
