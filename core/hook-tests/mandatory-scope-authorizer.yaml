# Fixture for mandatory-scope-authorizer.sh — blocks cross-company reads.
# Seeded by US-013 (hq-doctor). See core/hook-tests/README.md for the schema.
#
# Behavioural note: this hook short-circuits to pass-through (exit 0) at
# `[ -d "$HQ_ROOT/companies" ] || exit 0` when no companies/ tree is present.
# The --deep-test sandbox (SANDBOX_COPY_RELPATHS) copies only .claude/, .codex/,
# .grok/ and core/ — NOT companies/ — so in the sandbox the hook cannot run its
# scope check and allows every path. Cross-company block cases are therefore
# pinned with expectedFailure (reports KNOWN-DEFECT, never FAIL). The seeded
# shell regression suite verifies the manifest parser behavior directly.
hookId: mandatory-scope-authorizer
schemaVersion: 1
cases:
  # repos/ is always readable regardless of the bound company — a genuine allow.
  - name: allows-repos-read
    event: PreToolUse
    tool: Read
    input:
      file_path: "repos/public/hq-core/README.md"
    expect: allow

  # Reading companies/manifest.yaml is an allowlisted path. The deep-test
  # sandbox does not seed companies/, so its hook run short-circuits before the
  # scope parser. The seeded shell regression suite exercises this with a real
  # companies tree and pairs the allow with a foreign-company block.
  - name: manifest-read-is-allowed
    event: PreToolUse
    tool: Read
    input:
      file_path: "companies/manifest.yaml"
    expect: allow

  # A Bash command that mentions the manifest and another tenant must block.
  # The deep-test sandbox cannot exercise this because it has no companies tree.
  - name: manifest-plus-foreign-company-is-blocked
    event: PreToolUse
    tool: Bash
    input:
      command: "cat companies/manifest.yaml companies/otherco/secret.md"
    expect: block
    expectedFailure:
      reason: >
        The --deep-test sandbox does not seed companies/, so the hook exits
        before scope parsing and allows this command. The seeded
        mandatory-scope-authorizer shell test verifies the manifest allowlist
        and foreign-company denial together.

  # A cross-company read must be blocked in a live tree with a bound session.
  # The sandbox cannot exercise this (no companies/), so it is pinned.
  - name: cross-company-read-blocked
    event: PreToolUse
    tool: Read
    input:
      file_path: "companies/acme/secret.md"
    expect: block
    expectedFailure:
      reason: >
        The --deep-test sandbox (SANDBOX_COPY_RELPATHS) does not seed companies/,
        so mandatory-scope-authorizer.sh short-circuits to pass-through (exit 0)
        at `[ -d "$HQ_ROOT/companies" ] || exit 0` and cannot enforce
        cross-company isolation here. Enforcement is verified in a live tree with
        a bound session; it is unobservable in this sandbox, so this reports
        KNOWN-DEFECT rather than FAIL.
