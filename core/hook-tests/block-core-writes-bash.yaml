# Fixture for block-core-writes-bash.sh — blocks Bash writes into scaffold.
# Seeded by US-013 (hq-doctor). See core/hook-tests/README.md for the schema.
#
# The core.yaml-exclude strip helper used to fail open on BSD sed (empty
# stdout when the generated script errored). It now returns the original
# command on sed failure, so core/ writes stay blocked on every platform.
hookId: block-core-writes-bash
schemaVersion: 1
cases:
  # A redirect that would create/overwrite AGENTS.md (locked scaffold) is blocked.
  - name: blocks-redirect-into-agents-md
    event: PreToolUse
    tool: Bash
    input:
      command: "echo pwned > AGENTS.md"
    expect: block

  # A redirect into core/ must stay blocked even when exclude-stripping runs.
  - name: blocks-redirect-into-core
    event: PreToolUse
    tool: Bash
    input:
      command: "echo pwned > core/FAILOPEN-PROBE.txt"
    expect: block

  # A benign command touching nothing protected is passed through.
  - name: allows-benign-command
    event: PreToolUse
    tool: Bash
    input:
      command: "echo hello world"
    expect: allow
