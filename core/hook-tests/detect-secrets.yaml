# Fixture for detect-secrets.sh — blocks Bash commands carrying secrets.
# Seeded by US-013 (hq-doctor). See core/hook-tests/README.md for the schema.
#
# The credential in the block cases is the AWS-documentation EXAMPLE key (not a
# real secret); the hook reports only the pattern name and never echoes the
# value.
#
# HISTORY: until hq-core#91 the hook treated any line containing
# echo/grep/sed/awk/regex/pattern as a "pattern reference" and allowed it, and
# this fixture asserted that carve-out as intended behaviour. It was not
# defensible: `echo <secret> | pbcopy` is the hook's primary threat model, and
# the keyword match was unanchored, so appending `&& echo ok` to any command
# disarmed the detector. The carve-out is gone; an echo-prefixed secret now
# blocks like any other. The remaining suppressions are comment lines and
# quoted wildcard patterns, both still covered below.
hookId: detect-secrets
schemaVersion: 1
cases:
  # A real, non-escaped command carrying an AWS access-key pattern is blocked.
  - name: blocks-aws-access-key-in-command
    event: PreToolUse
    tool: Bash
    input:
      command: "aws configure set aws_access_key_id AKIAIOSFODNN7EXAMPLE"
    expect: block

  # An echo-prefixed command carrying the same key is blocked too (hq-core#91).
  # `echo <secret> | pbcopy` / `echo <secret> >> file` is how a credential
  # actually leaks into a transcript or a synced log, so this is the case the
  # hook exists to catch.
  - name: blocks-echo-prefixed-command
    event: PreToolUse
    tool: Bash
    input:
      command: "echo AKIAIOSFODNN7EXAMPLE"
    expect: block

  # A benign command with no secret pattern is passed through.
  - name: allows-command-without-secret
    event: PreToolUse
    tool: Bash
    input:
      command: "git status"
    expect: allow

  # Token boundary (hq-core#91): the sk- pattern must not match mid-word. HQ's
  # own policy filenames embed it (a-ri|sk-..., hq-ta|sk-..., ...-di|sk-...) and
  # reading one is not a credential event. Before the boundary these were
  # tolerated only because the sed/grep command hit the carve-out above.
  - name: allows-midword-prefix-in-a-policy-filename
    event: PreToolUse
    tool: Bash
    input:
      command: "sed -n 1,45p personal/policies/a-risk-that-blocks-a-user-decision.md"
    expect: allow

  # A comment line naming a key shape is still a documented suppression.
  - name: allows-comment-line-naming-a-key-shape
    event: PreToolUse
    tool: Write
    input:
      file_path: "/tmp/x/notes.sh"
      content: "# pattern: AKIA followed by 16 uppercase chars\n"
    expect: allow
