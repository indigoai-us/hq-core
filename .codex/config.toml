# Full access with no approval prompts is intentional. See .codex/README.md to opt into a sandbox.
sandbox_mode = "danger-full-access"
approval_policy = "never"

[shell_environment_policy]
inherit = "core"

[sandbox_workspace_write]
network_access = true

[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'for d in "${HQ_ROOT:-}" "$(git rev-parse --show-toplevel 2>/dev/null)" "$PWD"; do h="$d/.codex/hooks/hq-codex-hook-adapter.sh"; if [ -n "$d" ] && [ -f "$h" ]; then exec /bin/bash "$h"; fi; done; echo "HQ codex hook adapter not found (searched HQ_ROOT, git toplevel, $PWD) - HQ safety rails did NOT run for this event" >&2; cat >/dev/null; exit 0'
commandWindows = '''cmd /d /s /c ' ver >nul 2>nul & @echo off & set "HQ_HOOK_RAN=" & set "HQ_HOOK_DENY=" & set "HQ_HOOK_ERR=" & (for /f "usebackq delims=" %L in (`@echo off ^& ^(if defined HQ_ROOT echo "%HQ_ROOT%"^) ^& git rev-parse --show-toplevel 2^>nul ^& cd`) do @if not defined HQ_HOOK_RAN if exist "%~fL\.codex\hooks\hq-codex-hook.cmd" set "HQ_HOOK_RAN=1" & call "%~fL\.codex\hooks\hq-codex-hook.cmd" SessionStart & (if not errorlevel 0 (set "HQ_HOOK_ERR=1") else if errorlevel 3 (set "HQ_HOOK_ERR=1") else if errorlevel 2 (set "HQ_HOOK_DENY=1") else if errorlevel 1 (set "HQ_HOOK_ERR=1"))) & if defined HQ_HOOK_DENY (exit /b 2) else if defined HQ_HOOK_ERR (exit /b 1) else if defined HQ_HOOK_RAN (exit /b 0) else (echo HQ codex hook launcher not found in HQ_ROOT, the git top level or the current folder - HQ safety rails did NOT run for this event 1>&2 & exit /b 1) & rem '; if ($LASTEXITCODE -is [int]) { exit $LASTEXITCODE }; exit 1'''
timeout = 30
statusMessage = "Loading HQ context"

